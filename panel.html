        $('pay-status').innerHTML = '<div class="status-banner error">' + esc(result.error) + '</div>';
        $('pay-submit').disabled = false; $('pay-submit').textContent = 'Log Payment';
      }
    })
    .withFailureHandler(function(e) {
      $('pay-status').innerHTML = '<div class="status-banner error">' + esc(e.message) + '</div>';
      $('pay-submit').disabled = false; $('pay-submit').textContent = 'Log Payment';
    })
    .panelLogPaymentFromReceipt({
      description:      $('pay-description').value.trim(),
      amount:           netAmount,
      amountWithheld:   withheld,
      paymentDate:      $('pay-date').value,
      method:           $('pay-method').value,
      clientId:         $('pay-client').value || '',
      invoiceId:        $('pay-invoice').value || '',
      markPaid:         $('pay-markpaid').checked,
      closeProject:     !!($('pay-close-project') && $('pay-close-project').checked),
      projectId:        (function() {
                          var selInv = $('pay-invoice') ? $('pay-invoice').value : '';

                        })(),
      receiptFileId:    _paymentReceiptFileId || '',
      pickerSource:     _paymentReceiptPickerSource,
      receiptUrl:       '',
      notes:            $('pay-notes').value.trim(),
    });
}

function filterContractorList() {
  var search = ($('contractor-search') ? $('contractor-search').value : '').toLowerCase();
  var roleF = $('contractor-role-filter') ? $('contractor-role-filter').value : '';
  var typeF = $('contractor-type-filter') ? $('contractor-type-filter').value : '';

  var filtered = _cachedContractors.filter(function(c) {
    if (roleF && c.roles.indexOf(roleF) === -1) return false;
    if (typeF && c.type !== typeF) return false;
    if (search) {
      var hay = (c.name + ' ' + c.email + ' ' + c.roles.join(' ') + ' ' + c.type).toLowerCase();
      if (hay.indexOf(search) === -1) return false;
    }
    return true;
  });

  // Sort
  var col = _contractorSort.col, dir = _contractorSort.dir;
  filtered.sort(function(a, b) {
    var va = col === 'roles' ? a[col].join(', ') : (a[col] || '');
    var vb = col === 'roles' ? b[col].join(', ') : (b[col] || '');
    if (typeof va === 'string') va = va.toLowerCase();
    if (typeof vb === 'string') vb = vb.toLowerCase();
    if (va < vb) return dir === 'asc' ? -1 : 1;
    if (va > vb) return dir === 'asc' ? 1 : -1;
    return 0;
  });

  var html = '';
  if (!filtered.length) {
    html = '<tr><td colspan="7" class="empty">' + (search || roleF || typeF ? 'No contractors match your filters.' : 'No contractors found.') + '</td></tr>';
  } else {
    filtered.forEach(function(c) {
      html += '<tr onclick="navigate(\'contractor\',\'' + jsEsc(c.name) + '\',{contractorId:\'' + c.id + '\'})" style="cursor:pointer">'
        + '<td><strong>' + esc(c.name) + '</strong></td>'
        + '<td class="hide-mobile">' + esc(c.roles.join(', ')) + '</td>'
        + '<td class="hide-mobile">' + esc(c.type) + '</td>'
        + '<td class="hide-mobile">' + esc(c.email) + '</td>'
        + '<td class="hide-mobile">' + esc(c.phone) + '</td>'
        + '<td class="hide-mobile">' + esc(c.paymentMethod) + '</td>'
        + '<td>' + (c.isPartner ? '<span class="badge badge-success">Partner</span>' : '') + '</td>'
        + '</tr>';
    });
  }
  $('contractor-tbody').innerHTML = html;
}

function toggleContractorSort(col) {
  if (_contractorSort.col === col) { _contractorSort.dir = _contractorSort.dir === 'asc' ? 'desc' : 'asc'; }
  else { _contractorSort = { col: col, dir: 'asc' }; }
  // Re-render thead
  $('contractor-thead').innerHTML = '<tr>'
    + sortableTh('Name','name',_contractorSort,'toggleContractorSort','')
    + sortableTh('Roles','roles',_contractorSort,'toggleContractorSort','hide-mobile')

var _cachedQuotes = [];
var _quoteSort = { col: 'issuedDate', dir: 'desc' };
var _quoteFilterStatus = '';

function renderQuotes() {
  $('topbar-actions').innerHTML =
    (_isPartner() ? '<button class="btn btn-primary" onclick="navigate(\'newQuote\',\'New Quote\',{})">+ New Quote</button>' : '');

  _quoteSort = { col: 'issuedDate', dir: 'desc' };
  _quoteFilterStatus = '';

  if (_listCache.quotes !== null) { _doRenderQuotes(_listCache.quotes); return; }

  showLoading('Loading quotes\u2026');
  google.script.run
    .withSuccessHandler(function(quotes) {
      if (!quotes || quotes.error) { showError((quotes && quotes.error) || 'Failed to load quotes.'); return; }
      _listCache.quotes = quotes;
      _doRenderQuotes(quotes);
    })
    .withFailureHandler(function(e) { showError(e.message); })
    .panelGetAllQuotes();
}

function _doRenderQuotes(quotes) {
  _cachedQuotes = quotes;
  _renderQuoteList();
}

function _renderQuoteList() {
  var quotes = _cachedQuotes.slice();

  // Filter
  if (_quoteFilterStatus) quotes = quotes.filter(function(q) { return q.status === _quoteFilterStatus; });

  // Sort
  quotes.sort(function(a, b) {
    var av = a[_quoteSort.col] || '', bv = b[_quoteSort.col] || '';
    if (_quoteSort.col === 'total') { av = a.total || 0; bv = b.total || 0; return _quoteSort.dir === 'asc' ? av - bv : bv - av; }
    return _quoteSort.dir === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
  });

  // Stat cards — counts always reflect full data; value reflects active pipeline
  var total    = quotes.length;
  var accepted = quotes.filter(function(q) { return q.status === 'Accepted'; }).length;
  var pending  = quotes.filter(function(q) { return q.status === 'Sent'; }).length;
  // Pipeline value: when showing All, exclude Expired/Declined; when filtered, sum that status
  var pipelineQuotes = _quoteFilterStatus
    ? quotes
    : quotes.filter(function(q) { return q.status !== 'Expired' && q.status !== 'Declined'; });
  var totalVal = pipelineQuotes.reduce(function(s, q) { return s + (q.total || 0); }, 0);
  var valueLabel = _quoteFilterStatus ? (_quoteFilterStatus + ' Value') : 'Pipeline Value';

  var html = '<div class="stat-cards">'
    + '<div class="stat-card"><div class="stat-label">Quotes</div><div class="stat-value">' + total + '</div></div>'
    + '<div class="stat-card"><div class="stat-label">Accepted</div><div class="stat-value" style="color:#16a34a">' + accepted + '</div></div>'
    + '<div class="stat-card"><div class="stat-label">Pending</div><div class="stat-value" style="color:#d97706">' + pending + '</div></div>'
    + '<div class="stat-card"><div class="stat-label">' + valueLabel + '</div><div class="stat-value">' + formatMoney(totalVal) + '</div></div>'
    + '</div>';

function _addDaysClient(isoDate, n) {
  var d = new Date(isoDate + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return d.toISOString().split('T')[0];
}

function submitConvertToInvoice(quotePageId) {
  var issueISO = $('cti-issue') ? $('cti-issue').value : '';
  var dueISO   = $('cti-due')   ? $('cti-due').value   : '';
  var type     = $('cti-type')  ? $('cti-type').value  : 'Deposit';

  if (!issueISO) { $('cti-status').innerHTML = '<div class="status-banner error">Issue Date is required.</div>'; return; }
  if (!dueISO)   { $('cti-status').innerHTML = '<div class="status-banner error">Due Date is required.</div>'; return; }
  if (dueISO < issueISO) { $('cti-status').innerHTML = '<div class="status-banner error">Due Date must be on or after the Issue Date.</div>'; return; }

  $('cti-submit').disabled = true;
  $('cti-submit').textContent = 'Converting\u2026';
  $('cti-status').innerHTML = '';

  google.script.run
    .withSuccessHandler(function(result) {
      if (result.success) {
        _ssClear(); _invalidate('quotes', 'invoices');
        var msg = '<div class="status-banner success">&#10003; Invoice <strong>' + esc(result.invoiceId) + '</strong> created!';
        if (result.invoiceUrl) msg += ' <a href="' + esc(result.invoiceUrl) + '" target="_blank">View PDF &rarr;</a>';
        msg += '</div>';
        $('cti-status').innerHTML = msg;
        $('cti-submit').style.display = 'none';

        $('cti-status').innerHTML = '<div class="status-banner error">' + esc(result.error) + '</div>';
        $('cti-submit').disabled = false;
        $('cti-submit').textContent = 'Convert to Invoice';

    })
    .withFailureHandler(function(e) {
      $('cti-status').innerHTML = '<div class="status-banner error">' + esc(e.message) + '</div>';
      $('cti-submit').disabled = false;
      $('cti-submit').textContent = 'Convert to Invoice';

}

/**
 * Parse line items text blob (same format used by invoices) back to structured items.
 * "Name (xQty) — $LineTotal"
 */
function _parseQuoteLineItems(text) {
  if (!text) return [];
  return text.split('\n').map(function(line) {
    var m = line.trim().match(/^(.+) \(x(\d+(?:\.\d+)?)\) \u2014 \$([0-9,]+(?:\.\d+)?)$/);
    if (!m) return null;
    var qty = parseFloat(m[2]);
    var lineTotal = parseFloat(m[3].replace(/,/g, ''));
    return { id: Date.now() + Math.random(), name: m[1].trim(), description: '', qty: qty, price: qty > 0 ? lineTotal / qty : lineTotal };
  }).filter(Boolean);
}

function submitCloneQuote(originalQuoteId, clientId, projectId, mode) {
  var lineItems = [];
  var valid = true;
  _quoteLineItems.forEach(function(item) {
    var name  = $('nqli-name-'  + item.id) ? $('nqli-name-'  + item.id).value.trim() : '';
    var qty   = parseFloat($('nqli-qty-'   + item.id) ? $('nqli-qty-'   + item.id).value : 1) || 1;
    var price = parseFloat($('nqli-price-' + item.id) ? $('nqli-price-' + item.id).value : 0) || 0;
    var desc  = $('nqli-desc-'  + item.id) ? $('nqli-desc-'  + item.id).value.trim() : '';
    if (!name) { valid = false; return; }
    lineItems.push({ name: name, description: desc, qty: qty, price: price });
  });
  if (!valid || !lineItems.length) { $('nq-status').innerHTML = '<div class="status-banner error">Each line item needs a name.</div>'; return; }

  var issueD = $('nq-issue').value, validD = $('nq-valid').value;
  if (issueD && validD && validD < issueD) { $('nq-status').innerHTML = '<div class="status-banner error">Valid Until must be on or after the Issue Date.</div>'; return; }

  var btn = $('nq-submit');
  btn.disabled = true; btn.textContent = 'Creating\u2026';
  $('nq-status').innerHTML = '<div class="loading"><span class="spinner"></span> Generating quote PDF\u2026</div>';

  var payload = {
    clientId:     clientId,
    projectId:    projectId || '',
    issueDateISO: $('nq-issue').value,
    validDateISO: $('nq-valid').value,
    lineItems:    lineItems,
    tax:          parseFloat($('nq-tax').value) || 0,
  };

  var fnName = mode === 'revise' ? 'panelReviseQuote' : 'panelCreateQuote';
  var firstArg = mode === 'revise' ? originalQuoteId : null;

  var call = google.script.run
    .withSuccessHandler(function(r) {
      btn.disabled = false;
      btn.textContent = mode === 'revise' ? 'Create Revised Quote' : 'Create Quote';
      if (r.success) {
        _ssClear(); _invalidate('quotes');
        var msg = '&#10003; Quote <strong>' + esc(r.quoteId) + '</strong> created!';
        if (mode === 'revise') msg += ' ' + esc(r.expiredId) + ' marked as Expired.';
        if (r.url) msg += ' <a href="' + esc(r.url) + '" target="_blank">View PDF &rarr;</a>';
        $('nq-status').innerHTML = '<div class="status-banner success">' + msg + '</div>';
        if (r.pageId) {
          $('nq-status').innerHTML += '<button class="btn btn-secondary" style="margin-top:8px" onclick="navigate(\'quote\',\'' + jsEsc(r.quoteId) + '\',{quoteId:\'' + jsEsc(r.pageId) + '\'})">View Quote &rarr;</button>';
        }
        btn.style.display = 'none';
      } else {
        $('nq-status').innerHTML = '<div class="status-banner error">' + esc(r.error) + '</div>';
      }
    })
    .withFailureHandler(function(e) {
      btn.disabled = false;
      btn.textContent = mode === 'revise' ? 'Create Revised Quote' : 'Create Quote';
      $('nq-status').innerHTML = '<div class="status-banner error">' + esc(e.message) + '</div>';
    });

  if (mode === 'revise') {
    call.panelReviseQuote(originalQuoteId, payload);
  } else {
    call.panelCreateQuote(payload);
  }
}

    + '<div class="form-group"><label class="form-label">Project <span style="font-weight:400;color:#8c7b6b">(optional)</span></label><select class="form-select" id="nq-project"><option value="">-- None --</option></select></div>'

    + '<div class="form-row form-row-2">'

    + '<div class="form-group"><label class="form-label">Valid Until</label><input class="form-input" id="nq-valid" type="date" value="' + validDefault + '"></div>'

    + '<div class="form-group"><label class="form-label">Line Items</label>'
    + '<div id="nq-line-items"></div>'

    + '<div class="form-row form-row-2">'
    + '<div class="form-group"><label class="form-label">Tax ($)</label><input class="form-input" id="nq-tax" type="number" step="0.01" value="0" oninput="_renderQuoteTotals()"></div>'
    + '<div class="form-group"><label class="form-label">Quote Total</label><div id="nq-total-display" style="font-size:18px;font-weight:700;padding:8px 0;color:#2f2f2f">$0.00</div></div>'

}

function _loadNewQuoteDropdowns() {
  cachedGetClients(function(clients) {
    if (!clients || clients.error) return;
    var sel = $('nq-client');
    clients.filter(function(c) { return c.status === 'Active'; }).forEach(function(c) {
      var opt = document.createElement('option');
      opt.value = c.id; opt.textContent = c.name;
      sel.appendChild(opt);
    });
  });
  cachedGetProjects(function(projects) {
    if (!projects || projects.error) return;
    var sel = $('nq-project');
    projects.forEach(function(p) {
      var opt = document.createElement('option');
      opt.value = p.id; opt.textContent = p.name;
      sel.appendChild(opt);
    });
  });
}

function _renderQuoteLineItemsUI() {
  var container = $('nq-line-items');
  if (!container) return;
  var html = '';
  _quoteLineItems.forEach(function(item) {
    html += '<div class="line-item-row" id="nqli-' + item.id + '" style="border:1px solid #e8e1d9;border-radius:6px;padding:12px;margin-bottom:8px">'
      + '<div class="form-row form-row-2">'
      + '<div class="form-group" style="margin-bottom:6px"><label class="form-label">Item Name *</label>'
      + '<input class="form-input" id="nqli-name-' + item.id + '" value="' + esc(item.name) + '" placeholder="e.g. Photography"></div>'
      + '<div class="form-group" style="margin-bottom:6px;display:flex;gap:8px">'
      + '<div style="flex:1"><label class="form-label">Qty</label><input class="form-input" id="nqli-qty-' + item.id + '" type="number" step="1" min="1" value="' + item.qty + '" oninput="_renderQuoteTotals()"></div>'
      + '<div style="flex:2"><label class="form-label">Unit Price ($)</label><input class="form-input" id="nqli-price-' + item.id + '" type="number" step="0.01" min="0" value="' + item.price + '" oninput="_renderQuoteTotals()"></div>'
      + '</div></div>'
      + '<div class="form-group" style="margin-bottom:0"><label class="form-label">Description</label>'
      + '<input class="form-input" id="nqli-desc-' + item.id + '" value="' + esc(item.description) + '" placeholder="Optional details"></div>'
      + (_quoteLineItems.length > 1 ? '<button class="btn btn-danger btn-sm" style="margin-top:8px" onclick="removeQuoteLineItem(' + item.id + ')">Remove</button>' : '')
      + '</div>';
  });
  container.innerHTML = html;
  _renderQuoteTotals();
}

function addQuoteLineItem() {
  var newId = Date.now();
  _quoteLineItems.push({ id: newId, name: '', description: '', qty: 1, price: 0 });
  _renderQuoteLineItemsUI();
}

function removeQuoteLineItem(id) {
  _quoteLineItems = _quoteLineItems.filter(function(i) { return i.id !== id; });
  _renderQuoteLineItemsUI();
}

function _renderQuoteTotals() {
  var subtotal = 0;
  _quoteLineItems.forEach(function(item) {
    var qty   = parseFloat($('nqli-qty-'   + item.id) ? $('nqli-qty-'   + item.id).value : item.qty)   || 0;
    var price = parseFloat($('nqli-price-' + item.id) ? $('nqli-price-' + item.id).value : item.price) || 0;
    subtotal += qty * price;
  });
  var tax   = parseFloat($('nq-tax') ? $('nq-tax').value : 0) || 0;
  var total = subtotal + tax;
  if ($('nq-total-display')) $('nq-total-display').textContent = formatMoney(total);
}

function submitNewQuote() {
  var clientId  = $('nq-client').value;
  var projectId = $('nq-project').value;
  if (!clientId) { $('nq-status').innerHTML = '<div class="status-banner error">Please select a client.</div>'; return; }

  var lineItems = [];
  var valid = true;
  _quoteLineItems.forEach(function(item) {
    var name  = $('nqli-name-'  + item.id) ? $('nqli-name-'  + item.id).value.trim() : '';
    var qty   = parseFloat($('nqli-qty-'   + item.id) ? $('nqli-qty-'   + item.id).value : 1) || 1;
    var price = parseFloat($('nqli-price-' + item.id) ? $('nqli-price-' + item.id).value : 0) || 0;
    var desc  = $('nqli-desc-'  + item.id) ? $('nqli-desc-'  + item.id).value.trim() : '';
    if (!name) { valid = false; return; }
    lineItems.push({ name: name, description: desc, qty: qty, price: price });
  });

  if (!valid || !lineItems.length) { $('nq-status').innerHTML = '<div class="status-banner error">Each line item needs a name.</div>'; return; }
  var issueD = $('nq-issue').value, validD = $('nq-valid').value;
  if (issueD && validD && validD < issueD) { $('nq-status').innerHTML = '<div class="status-banner error">Valid Until must be on or after the Issue Date.</div>'; return; }

  $('nq-submit').disabled = true;
  $('nq-submit').textContent = 'Creating\u2026';
  $('nq-status').innerHTML = '';

  google.script.run
    .withSuccessHandler(function(result) {
      if (result.success) {
        _ssClear(); _invalidate('quotes');
        var msg = '<div class="status-banner success">&#10003; Quote <strong>' + esc(result.quoteId) + '</strong> created!';
        if (result.url) msg += ' <a href="' + esc(result.url) + '" target="_blank">View PDF &rarr;</a>';
        msg += '</div>';
        if (result.notionError) {
          msg += '<div class="status-banner warning" style="margin-top:6px">⚠ PDF created but Notion record failed — verify in Notion manually. (' + esc(result.notionError) + ')</div>';
        }
        if (result.pageId) {
          msg += '<button class="btn btn-secondary" style="margin-top:8px" onclick="navigate(\'quote\',\'' + jsEsc(result.quoteId) + '\',{quoteId:\'' + jsEsc(result.pageId) + '\'})">View Quote &rarr;</button>';
        }
        $('nq-status').innerHTML = msg;
        $('nq-submit').style.display = 'none';
      } else {
        $('nq-status').innerHTML = '<div class="status-banner error">' + esc(result.error) + '</div>';
        $('nq-submit').disabled = false;
        $('nq-submit').textContent = 'Create Quote';
      }
    })
    .withFailureHandler(function(e) {
      $('nq-status').innerHTML = '<div class="status-banner error">' + esc(e.message) + '</div>';
      $('nq-submit').disabled = false;
      $('nq-submit').textContent = 'Create Quote';
    })
    .panelCreateQuote({
      clientId:    clientId,
      projectId:   projectId || '',
      issueDateISO: $('nq-issue').value,
      validDateISO: $('nq-valid').value,
      lineItems:   lineItems,
      tax:         parseFloat($('nq-tax').value) || 0,
    });
}

  content.innerHTML = '<div style="color:#8c7b6b;font-size:13px">Loading ' + year + ' tax summary…</div>';

    html += '<div class="stat-card"><div class="stat-label">Withheld</div><div class="stat-value" style="color:#d97706">' + formatMoney(d.amountWithheld) + '</div></div>'
      + '<div class="stat-card"><div class="stat-label">Total Received</div><div class="stat-value">' + formatMoney(d.totalReceived) + '</div></div>';
  }

  html += '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#8c7b6b;margin-bottom:10px">Expenses by Category</div>';

  for (var cat in d.expensesByCategory) catEntries.push({ label: cat, value: d.expensesByCategory[cat] });

/**
 * Build an HTML horizontal bar chart from a { label: value } object.
 * Bars are sorted descending by value and scaled relative to the max.
 * @param {Object<string,number>} data       - Label-to-value mapping.
 * @param {string}                colorClass - CSS class for bar fill ('green', 'red', or '').
 * @returns {string} HTML string.
 */
function buildBarChart(data, colorClass) {
  var entries = [];
  for (var k in data) entries.push({ label: k, value: data[k] });
  entries.sort(function(a,b) { return b.value - a.value; });
  if (!entries.length) return '<div class="empty">No data.</div>';
  var max = Math.max.apply(null, entries.map(function(e){return e.value})) || 1;
  var html = '';
  entries.forEach(function(e) {
    var pct = Math.max(2, (e.value / max) * 100);
    html += '<div class="bar-row">'
      + '<div class="bar-label" title="' + esc(e.label) + '">' + esc(e.label) + '</div>'
      + '<div class="bar-track"><div class="bar-fill ' + colorClass + '" style="width:' + pct + '%"></div></div>'
      + '<div class="bar-amount">' + formatMoney(e.value) + '</div></div>';
  });
  return html;
}

/**
 * Build a horizontal bar chart where bar widths represent % of total.
 * Each row shows: label | bar (% wide) | XX.X%  $X,XXX
 * @param {Object<string,number>} data
 * @param {string} colorHint  'green' or 'red'
 * @returns {string} HTML string.
 */
function buildPercentageBarChart(data, colorHint) {
  var entries = [];
  for (var k in data) { if ((data[k] || 0) > 0) entries.push({ label: k, value: data[k] }); }
  entries.sort(function(a,b) { return b.value - a.value; });
  if (!entries.length) return '<div class="empty">No data.</div>';
  var total = entries.reduce(function(s,e) { return s + e.value; }, 0) || 1;
  var fillClass = colorHint === 'red' ? 'red' : 'green';
  var html = '';
  entries.forEach(function(e) {
    var pct = (e.value / total) * 100;
    html += '<div class="bar-row">'
      + '<div class="bar-label" title="' + esc(e.label) + '">' + esc(e.label) + '</div>'
      + '<div class="bar-track"><div class="bar-fill ' + fillClass + '" style="width:' + Math.max(2, pct) + '%"></div></div>'
      + '<div class="bar-amount">' + pct.toFixed(1) + '%'
      + '<span style="color:#8c7b6b;font-size:12px;margin-left:6px">' + formatMoney(e.value) + '</span></div>'
      + '</div>';
  });
  return html;
}

/**
 * Build an HTML horizontal bar chart that handles negative values.
 * Bars are green for positive profit, red for negative.
 * @param {Object<string,number>} data - Label-to-profit-value mapping.
 * @returns {string} HTML string.
 */
function buildProfitChart(data) {
  var entries = [];
  for (var k in data) entries.push({ label: k, value: data[k] });
  entries.sort(function(a,b) { return b.value - a.value; });
  if (!entries.length) return '<div class="empty">No data.</div>';
  var absMax = Math.max.apply(null, entries.map(function(e){return Math.abs(e.value)})) || 1;
  var html = '';
  entries.forEach(function(e) {
    var pct = Math.max(2, (Math.abs(e.value) / absMax) * 100);
    var cls = e.value >= 0 ? 'green' : 'red';
    html += '<div class="bar-row">'
      + '<div class="bar-label" title="' + esc(e.label) + '">' + esc(e.label) + '</div>'
      + '<div class="bar-track"><div class="bar-fill ' + cls + '" style="width:' + pct + '%"></div></div>'
      + '<div class="bar-amount">' + formatMoney(e.value) + '</div></div>';
  });
  return html;
}

/**

 * @param {string} clientId   - Notion page ID of the client.
 * @param {Object} extra      - Additional context (total, dueDate, driveLink, fileUrl).
 */
function openComposeEmail(entityType, entityId, documentId, clientId, extra) {
  navigate('compose', 'Compose Email', {
    entityType: entityType,
    entityId: entityId,
    documentId: documentId,
    clientId: clientId,
    total: extra.total || '',
    dueDate: extra.dueDate || '',
    issueDate: extra.issueDate || '',
    driveLink: extra.driveLink || '',
    fileUrl: extra.fileUrl || '',
    projectId: extra.projectId || '',
    balanceDue: extra.balanceDue || '',
  });
}

/**
 * Render the Compose Email form.
 * Fetches templates and contact data via panelGetComposeData(), then
 * builds a form with template selector, To/Subject/Body fields,
 * attachment indicator, and Send/Draft buttons. Stores compose state
 * in window._composeState for template switching.
 * @param {Object} data - Navigation data (entityType, entityId, clientId, etc.).
 */
function renderComposeView(data) {
  var content = $('content');
  content.innerHTML = '<div class="loading"><span class="spinner"></span> Preparing email&hellip;</div>';

  var documentType = data.entityType === 'invoice' ? 'Invoice' : 'Agreement';
  var fileId = extractFileIdFromUrl(data.driveLink || data.fileUrl || '');

  google.script.run
    .withSuccessHandler(function(result) {
      if (result.error) {
        content.innerHTML = '<div class="status-banner error">' + esc(result.error) + '</div>';
        return;
      }

      // Store state for template switching and sending
      window._composeState = {
        variables: result.variables,
        fileId: fileId,
        entityType: data.entityType,
        entityId: data.entityId,
        templates: result.templates,
      };

      var html = '<div class="compose-form">';
      html += '<div class="card"><div class="card-header"><h2>Compose Email</h2></div><div class="card-body">';

      // Template selector
      html += '<div class="form-group"><label class="form-label">Template</label>'
        + '<select class="form-select" id="compose-template" onchange="onComposeTemplateChange()">';
      result.templates.forEach(function(t) {
        html += '<option value="' + esc(t.id) + '"' + (t.id === result.selectedTemplateId ? ' selected' : '') + '>'
          + esc(t.name) + (t.isDefault ? ' (Default)' : '') + '</option>';
      });
      html += '</select></div>';

      // To field
      html += '<div class="form-group"><label class="form-label">To</label>'

/**
 * Submit the Compose Email form — either send directly or save as draft.
 * Validates required fields, then calls panelSendDocumentEmail() or
 * panelCreateComposedDraft(). Also updates entity status to 'Sent'
 * when sending directly.
 * @param {boolean} sendDirectly - True to send immediately, false to save as Gmail draft.
 */
function submitComposeEmail(sendDirectly) {
  var to = $('compose-to').value.trim();
  var subject = $('compose-subject').value.trim();
  var body = $('compose-body').value;
  var state = window._composeState;

  if (!to) { $('compose-status').innerHTML = '<div class="status-banner error">Recipient email is required.</div>'; return; }
  if (!subject) { $('compose-status').innerHTML = '<div class="status-banner error">Subject is required.</div>'; return; }

  var sendBtn = $('compose-send');
  var draftBtn = $('compose-draft');
  sendBtn.disabled = true; draftBtn.disabled = true;
  var actionLabel = sendDirectly ? 'Sending' : 'Creating draft';
  $('compose-status').innerHTML = '<div class="loading"><span class="spinner"></span> ' + actionLabel + '&hellip;</div>';

  if (sendDirectly) {
    google.script.run
      .withSuccessHandler(function(result) {
        sendBtn.disabled = false; draftBtn.disabled = false;
        if (result.success) {
          _ssClear();
          var msg = 'Email sent successfully. Status updated to Sent.';
          if (result.statusUpdateError) {
            msg = 'Email sent, but status update failed: ' + esc(result.statusUpdateError);
          }
          $('compose-status').innerHTML = '<div class="status-banner success">' + msg + '</div>';
          sendBtn.style.display = 'none';
          draftBtn.style.display = 'none';
        } else {
          $('compose-status').innerHTML = '<div class="status-banner error">' + esc(result.error) + '</div>';
        }
      })
      .withFailureHandler(function(e) {
        sendBtn.disabled = false; draftBtn.disabled = false;
        $('compose-status').innerHTML = '<div class="status-banner error">' + esc(e.message) + '</div>';
      })
      .panelSendDocumentEmail({
        to: to, subject: subject, body: body,
        fileId: state.fileId || '',
        entityType: state.entityType,
        entityId: state.entityId,
      });
  } else {
    google.script.run
      .withSuccessHandler(function(result) {
        sendBtn.disabled = false; draftBtn.disabled = false;
        if (result.success) {
          $('compose-status').innerHTML = '<div class="status-banner success">Draft created: <strong>' + esc(result.draftSubject) + '</strong>'
            + '<br><a href="https://mail.google.com/mail/u/0/#drafts" target="_blank">Open Gmail Drafts &rarr;</a></div>';
        } else {
          $('compose-status').innerHTML = '<div class="status-banner error">' + esc(result.error) + '</div>';
        }
      })
      .withFailureHandler(function(e) {
        sendBtn.disabled = false; draftBtn.disabled = false;
        $('compose-status').innerHTML = '<div class="status-banner error">' + esc(e.message) + '</div>';
      })
      .panelCreateComposedDraft({ to: to, subject: subject, body: body, fileId: state.fileId || '' });
  }
}

 */
function updateQuickDueDate() {
  var issue = $('qi-issue').value;
  if (!issue) return;
  var d = new Date(issue + 'T12:00:00');
  d.setDate(d.getDate() + 14);
  $('qi-due').value = d.toISOString().split('T')[0];
}

/**
 * Collect all line items from the quick-create form into an array.
 * @returns {Array} Line items with name, description, qty, price.
 */
function getQuickLineItems() {
  var items = [];
  var rows = $('qi-items').children;
  for (var i = 0; i < rows.length; i++) {
    var id = rows[i].id.replace('qi-li-', '');
    var name = ($('qi-name-' + id) || {}).value || '';
    if (!name.trim()) continue;
    items.push({
      name: name.trim(),
      description: (($('qi-desc-' + id) || {}).value || '').trim(),
      qty: parseFloat(($('qi-qty-' + id) || {}).value || 1),
      price: parseFloat(($('qi-price-' + id) || {}).value || 0)
    });
  }
  return items;
}

/**
 * Submit the quick-create invoice form. Collects line items and form data,
 * calls panelQuickCreateInvoice(), and shows result with Drive link.
 * On success, reloads the project view to show the new invoice.
 * @param {string} clientId  - Notion page ID of the client.
 * @param {string} projectId - Notion page ID of the project.
 */
function submitQuickInvoice(clientId, projectId) {
  var lineItems = getQuickLineItems();
  if (!lineItems.length) {
    $('qi-status').innerHTML = '<div class="status-banner error">Please add at least one line item with a name.</div>';
    return;
  }
  var zeroItems = lineItems.filter(function(item) { return !item.price || item.price <= 0; });
  if (zeroItems.length && !confirm(zeroItems.length + ' line item(s) have a $0 price. Continue anyway?')) return;

  var issueVal = $('qi-issue').value, dueVal = $('qi-due').value;
  if (issueVal && dueVal && dueVal < issueVal) {
    $('qi-status').innerHTML = '<div class="status-banner error">Due Date must be on or after the Issue Date.</div>';
    return;
  }

  var btn = $('qi-submit');
  btn.disabled = true; btn.textContent = 'Creating\u2026';
  $('qi-status').innerHTML = '<div class="loading"><span class="spinner"></span> Generating invoice PDF\u2026</div>';

    clientId: clientId,

    invoiceType: $('qi-type').value,
    tax: parseFloat($('qi-tax').value || 0),
    issueDateISO: $('qi-issue').value,
    dueDateISO: $('qi-due').value,
    lineItems: lineItems
  };

  google.script.run
    .withSuccessHandler(function(r) {
      btn.disabled = false; btn.textContent = 'Create Invoice';
      if (r.success) {
        _invalidate('invoices');
        var msg = 'Invoice <strong>' + esc(r.invoiceId) + '</strong> created!';
        if (r.url) msg += ' <a href="' + esc(r.url) + '" target="_blank" style="color:inherit;text-decoration:underline">Open in Drive \u2197</a>';
        var bannerHtml = '<div class="status-banner success">' + msg + '</div>';
        if (r.notionError) {
          bannerHtml += '<div class="status-banner warning" style="margin-top:6px">\u26a0 PDF created but Notion record failed \u2014 verify in Notion manually. (' + esc(r.notionError) + ')</div>';
        }
        $('qi-status').innerHTML = bannerHtml;
        // Reload project view after a short delay to show the new invoice
        setTimeout(function() {
          navigate('project', currentView.title, { projectId: projectId, clientId: clientId });
        }, r.notionError ? 4000 : 1500);
      } else {
        $('qi-status').innerHTML = '<div class="status-banner error">' + esc(r.error) + '</div>';
      }
    })
    .withFailureHandler(function(e) {
      btn.disabled = false; btn.textContent = 'Create Invoice';
      $('qi-status').innerHTML = '<div class="status-banner error">' + esc(e.message) + '</div>';
    })
    .panelQuickCreateInvoice(data);
}

/**
 * Parse the stored line items text blob back into structured items.
 * Format per line: "Name (xQty) — $LineTotal"
 */
function _parseInvoiceLineItems(text) {
  if (!text) return [];
  return text.split('\n').map(function(line) {
    var m = line.trim().match(/^(.+) \(x(\d+(?:\.\d+)?)\) \u2014 \$([0-9,]+(?:\.\d+)?)$/);
    if (!m) return null;
    var qty = parseFloat(m[2]);
    var lineTotal = parseFloat(m[3].replace(/,/g, ''));
    return { name: m[1].trim(), description: '', qty: qty, price: qty > 0 ? lineTotal / qty : lineTotal };
  }).filter(Boolean);
}

    + '</div>';

  if (mode === 'revise' && paidPayments.length) {
    html += '<div class="form-group" class="form-check" style="margin-top:12px">'
      + '<input type="checkbox" id="rev-transfer" checked>'
      + '<label for="rev-transfer" style="font-size:13px">Transfer ' + paidPayments.length
      + ' logged payment' + (paidPayments.length !== 1 ? 's' : '') + ' to the new invoice</label>'
      + '</div>';
  }

  var payIdsAttr = mode === 'revise' && paidPayments.length
    ? JSON.stringify(paidPayments.map(function(p) { return p.id; }))
    : '[]';

  html += '<div id="cli-status" style="margin-top:12px;margin-bottom:8px"></div>'
    + '<div style="display:flex;gap:8px">'
    + '<button class="btn btn-primary" id="cli-submit" onclick="submitCloneInvoice(\''
    + jsEsc(inv.id) + '\',\'' + jsEsc(mode) + '\',' + payIdsAttr + ')">' + btnText + '</button>'
    + '<button class="btn btn-secondary" onclick="goBack()">Cancel</button>'
    + '</div>'
    + '</div></div></div>';

  $('content').innerHTML = html;

  // Pre-populate line items using the existing qi-* helpers
  _qiCount = 0;
  var parsed = _parseInvoiceLineItems(inv.lineItems);
  if (parsed.length) {
    parsed.forEach(function(item) {
      addQuickLineItem();
      var n = _qiCount;
      $('qi-name-' + n).value = item.name;
      if ($('qi-desc-' + n)) $('qi-desc-' + n).value = '';
      $('qi-qty-' + n).value = item.qty;
      $('qi-price-' + n).value = item.price.toFixed(2);
    });
  } else {
    addQuickLineItem();
  }
  updateQuickTotals();
}

/**
 * Submit the clone/revise form.
 * Clone: calls panelQuickCreateInvoice.
 * Revise: calls panelReviseInvoice — voids original, creates new, optionally transfers payments.
 */
function submitCloneInvoice(originalInvoiceId, mode, paymentIds) {
  var lineItems = getQuickLineItems();
  if (!lineItems.length) {
    $('cli-status').innerHTML = '<div class="status-banner error">Please add at least one line item with a name.</div>';
    return;
  }
  var btn = $('cli-submit');
  btn.disabled = true;
  btn.textContent = 'Creating\u2026';
  $('cli-status').innerHTML = '<div class="loading"><span class="spinner"></span> Generating invoice PDF\u2026</div>';

  var inv = currentView.data.inv;
  var transferPayments = mode === 'revise' && $('rev-transfer') && $('rev-transfer').checked;

  var invoiceData = {
    clientId:     inv.clientId,
    projectId:    inv.projectId || '',
    invoiceType:  $('qi-type').value,
    tax:          parseFloat($('qi-tax').value || 0),
    issueDateISO: $('qi-issue').value,
    dueDateISO:   $('qi-due').value,
    lineItems:    lineItems
  };

  if (mode === 'revise') {
    google.script.run
      .withSuccessHandler(function(r) {
        btn.disabled = false; btn.textContent = 'Create Revised Invoice';
        if (r.success) {
          _ssClear(); _invalidate('invoices', 'payments');
          var msg = 'Invoice <strong>' + esc(r.invoiceId) + '</strong> created. '
            + esc(r.voidedId) + ' has been voided.';
          if (r.paymentsMoved) msg += ' ' + r.paymentsMoved + ' payment(s) transferred.';
          if (r.url) msg += ' <a href="' + esc(r.url) + '" target="_blank" style="color:inherit;text-decoration:underline">Open in Drive \u2197</a>';
          $('cli-status').innerHTML = '<div class="status-banner success">' + msg + '</div>';
          btn.textContent = 'Done';
        } else {
          $('cli-status').innerHTML = '<div class="status-banner error">' + esc(r.error) + '</div>';
          btn.disabled = false; btn.textContent = 'Create Revised Invoice';
        }
      })
      .withFailureHandler(function(e) {
        btn.disabled = false; btn.textContent = 'Create Revised Invoice';
        $('cli-status').innerHTML = '<div class="status-banner error">' + esc(e.message) + '</div>';
      })
      .panelReviseInvoice(originalInvoiceId, invoiceData, transferPayments ? paymentIds : []);
  } else {
    google.script.run
      .withSuccessHandler(function(r) {
        btn.disabled = false; btn.textContent = 'Create Invoice';
        if (r.success) {
          _ssClear(); _invalidate('invoices');
          var msg = 'Invoice <strong>' + esc(r.invoiceId) + '</strong> created!';
          if (r.url) msg += ' <a href="' + esc(r.url) + '" target="_blank" style="color:inherit;text-decoration:underline">Open in Drive \u2197</a>';
          $('cli-status').innerHTML = '<div class="status-banner success">' + msg + '</div>';
          btn.textContent = 'Done';
        } else {
          $('cli-status').innerHTML = '<div class="status-banner error">' + esc(r.error) + '</div>';
        }
      })
      .withFailureHandler(function(e) {
        btn.disabled = false; btn.textContent = 'Create Invoice';
        $('cli-status').innerHTML = '<div class="status-banner error">' + esc(e.message) + '</div>';
      })
      .panelQuickCreateInvoice(invoiceData);
  }
}

/** Collect reminder settings from the form and save via panelSaveSettings(). */
function saveSettings() {
  var btn = $('settings-save');
  btn.disabled = true; btn.textContent = 'Saving\u2026';

  var intervals = $('rem-intervals').value.split(',').map(function(s) { return parseInt(s.trim()); }).filter(function(n) { return n > 0; });
  if (!intervals.length) intervals = [7, 14, 30];

  var data = {
    reminders: {
      enabled: $('rem-toggle').classList.contains('on'),
      daysBefore: parseInt($('rem-days-before').value) || 3,
      overdueIntervals: intervals,
    }
  };

  google.script.run
    .withSuccessHandler(function(r) {
      btn.disabled = false; btn.textContent = 'Save Settings';
      if (r.success) {
        $('settings-status').innerHTML = '<div class="status-banner success" style="animation:fadeOut 2s 1s forwards">Settings saved.</div>';
      } else {
        $('settings-status').innerHTML = '<div class="status-banner error">' + esc(r.error) + '</div>';
      }
    })
    .withFailureHandler(function(e) {
      btn.disabled = false; btn.textContent = 'Save Settings';
      $('settings-status').innerHTML = '<div class="status-banner error">' + esc(e.message) + '</div>';
    })
    .panelSaveSettings(data);
}

/**

  google.script.run
    .withSuccessHandler(function(templates) {
      var listEl = $('tpl-list');
      if (!listEl) return;
      if (!templates || !templates.length) {
        listEl.innerHTML = '<div class="empty">No templates found.</div>';
        return;
      }
      var typeLabels = {
        invoice: 'Invoice', agreement: 'Agreement',
        reminder_upcoming: 'Reminder (Upcoming)', reminder_overdue: 'Reminder (Overdue)'
      };
      var html = '';

          + '<div class="tpl-list-name">' + esc(t.name) + '</div>'
          + '<div class="tpl-list-type">' + esc(typeLabels[t.type] || t.type)
          + (t.isDefault ? ' <span class="tpl-list-default">' + (t.isCustomized ? '(customized)' : '(built-in)') + '</span>' : '') + '</div>'
          + '</div>'
          + '<div style="display:flex;gap:6px">';
        html += '<button class="action-btn" onclick="editEmailTemplate(\'' + jsEsc(t.id) + '\')">Edit</button>';
        if (t.isDefault && t.isCustomized) {
          html += '<button class="action-btn" onclick="resetEmailTemplate(\'' + jsEsc(t.id) + '\',\'' + jsEsc(t.name) + '\')">Reset</button>';
        } else if (!t.isDefault) {
          html += '<button class="action-btn" onclick="deleteEmailTemplate(\'' + jsEsc(t.id) + '\',\'' + jsEsc(t.name) + '\')">Delete</button>';
        }
        html += '</div></div>';
      });
      listEl.innerHTML = html;
    })
    .withFailureHandler(function(e) {
      var listEl = $('tpl-list');
      if (listEl) listEl.innerHTML = '<div class="status-banner error">Failed to load templates.</div>';
    })
    .panelGetEmailTemplates();
}

 * @param {string} templateId - ID of the template to edit.
 */
function editEmailTemplate(templateId) {
  google.script.run
    .withSuccessHandler(function(templates) {
      var t = null;
      for (var i = 0; i < templates.length; i++) {
        if (templates[i].id === templateId) { t = templates[i]; break; }
      }
      if (!t) {
        var listEl = $('tpl-list');
        if (listEl) listEl.insertAdjacentHTML('afterbegin', '<div class="status-banner error" style="margin-bottom:8px">Template not found.</div>');
        return;
      }
      $('tpl-edit-id').value = t.id;
      $('tpl-name').value = t.name;
      $('tpl-type').value = t.type;
      $('tpl-subject').value = t.subject;
      $('tpl-body').value = t.body;
      $('tpl-form-status').innerHTML = '';
      $('tpl-form').style.display = 'block';
      $('tpl-create-btn').textContent = 'Cancel';
      $('tpl-form').scrollIntoView({ behavior: 'smooth' });
    })
    .withFailureHandler(function(e) {
      var listEl = $('tpl-list');
      if (listEl) listEl.insertAdjacentHTML('afterbegin', '<div class="status-banner error" style="margin-bottom:8px">Failed to load template: ' + esc(e.message) + '</div>');
    })
    .panelGetEmailTemplates();
}

/** Save a new or edited email template via panelSaveEmailTemplate(). */
function saveEmailTemplate() {
  var name    = $('tpl-name').value.trim();
  var subject = $('tpl-subject').value.trim();
  var body    = $('tpl-body').value.trim();
  if (!name)    { $('tpl-form-status').innerHTML = '<div class="status-banner error">Template name is required.</div>'; return; }

    id: $('tpl-edit-id').value || null,
    name: name,
    type: $('tpl-type').value,
    subject: subject,
    body: $('tpl-body').value,

    .withSuccessHandler(function(result) {
      btn.disabled = false; btn.textContent = 'Save Template';

// ── SYSTEM HEALTH CHECK (SETTINGS) ──────────────────────────

/**
 * Run a comprehensive health check of all dependencies, schemas, and config.
 * Displays results as a color-coded table in the Settings page.
 */
function runHealthCheck() {
  var btn = $('hc-run-btn');
  btn.disabled = true; btn.textContent = 'Checking\u2026';
  $('hc-results').innerHTML = '<div class="loading"><span class="spinner"></span> Running health check\u2026 this may take 15\u201320 seconds.</div>';

  google.script.run
    .withSuccessHandler(function(r) {
      btn.disabled = false; btn.textContent = 'Run Health Check';
      if (!r || !r.checks) {
        $('hc-results').innerHTML = '<div class="status-banner error">Health check returned no data.</div>';
        return;
      }

      var icons = { ok: '\u2705', warn: '\u26A0\uFE0F', error: '\u274C' };
      var colors = { ok: '#166534', warn: '#92400e', error: '#991b1b' };

      var html = '<div class="table-wrap"><table class="data-table" style="font-size:13px"><thead><tr>'
        + '<th style="width:40px"></th><th>Check</th><th>Details</th></tr></thead><tbody>';

      var okCount = 0, warnCount = 0, errorCount = 0;
      r.checks.forEach(function(c) {
        if (c.status === 'ok') okCount++;
        else if (c.status === 'warn') warnCount++;
        else errorCount++;

        html += '<tr><td style="text-align:center">' + icons[c.status] + '</td>'
          + '<td><strong>' + esc(c.name) + '</strong></td>'
          + '<td style="color:' + colors[c.status] + '">' + esc(c.message) + '</td></tr>';
      });
      html += '</tbody></table></div>';

      // Summary
      var summaryClass = errorCount > 0 ? 'error' : (warnCount > 0 ? 'warning' : 'success');
      var summaryMsg = okCount + ' passed';
      if (warnCount) summaryMsg += ', ' + warnCount + ' warning' + (warnCount > 1 ? 's' : '');
      if (errorCount) summaryMsg += ', ' + errorCount + ' error' + (errorCount > 1 ? 's' : '');

      $('hc-results').innerHTML = '<div class="status-banner ' + summaryClass + '" style="margin-bottom:12px">'
        + summaryMsg + ' &mdash; ' + new Date(r.timestamp).toLocaleString() + '</div>' + html;
    })
    .withFailureHandler(function(e) {
      btn.disabled = false; btn.textContent = 'Run Health Check';
      $('hc-results').innerHTML = '<div class="status-banner error">Health check failed: ' + esc(e.message) + '</div>';
    })
    .panelHealthCheck();
}

var _roleTable = {}; // local copy of { email: role }

function loadRoleTable() {
  google.script.run
    .withSuccessHandler(function(roles) {
      _roleTable = roles || {};
      _renderRoleTable();
    })
    .withFailureHandler(function(e) {
      $('roles-tbody').innerHTML = '<tr><td colspan="3" class="empty" style="color:#b91c1c">' + esc(e.message) + '</td></tr>';
    })
    .panelGetRoleTable();
}

function _renderRoleTable() {
  var emails = Object.keys(_roleTable);
  if (!emails.length) {
    $('roles-tbody').innerHTML = '<tr><td colspan="3" class="empty">No additional users. Add one below.</td></tr>';
    return;
  }
  emails.sort();
  var html = '';
  emails.forEach(function(email) {
    var role = _roleTable[email];
    html += '<tr>'
      + '<td>' + esc(email) + '</td>'
      + '<td><select class="form-select" style="padding:4px 8px;font-size:13px" onchange="_roleTable[\'' + jsEsc(email) + '\']=this.value;saveRoleTable()">'
      + ['admin','partner','staff'].map(function(r) {
          return '<option value="' + r + '"' + (role === r ? ' selected' : '') + '>' + r.charAt(0).toUpperCase() + r.slice(1) + '</option>';
        }).join('')
      + '</select></td>'
      + '<td><button class="btn btn-danger btn-sm" onclick="removeRoleEntry(\'' + jsEsc(email) + '\')">Remove</button></td>'
      + '</tr>';
  });
  $('roles-tbody').innerHTML = html;
}

function addRoleEntry() {
  var email = $('role-new-email').value.trim().toLowerCase();
  var role  = $('role-new-role').value;
  if (!email || !_EMAIL_RE.test(email)) {
    $('roles-status').innerHTML = '<div class="status-banner error">Enter a valid email address.</div>';
    return;
  }
  _roleTable[email] = role;
  $('role-new-email').value = '';
  _renderRoleTable();
  saveRoleTable();
}

function removeRoleEntry(email) {
  delete _roleTable[email];
  _renderRoleTable();
  saveRoleTable();
}

function saveRoleTable() {
  $('roles-status').innerHTML = '<div class="status-banner" style="background:#f0ede5">Saving\u2026</div>';
  google.script.run
    .withSuccessHandler(function(r) {
      if (r.success) {
        $('roles-status').innerHTML = '<div class="status-banner success" style="animation:fadeOut 2s 1s forwards">Saved.</div>';
      } else {
        $('roles-status').innerHTML = '<div class="status-banner error">' + esc(r.error) + '</div>';
      }
    })
    .withFailureHandler(function(e) {
      $('roles-status').innerHTML = '<div class="status-banner error">' + esc(e.message) + '</div>';
    })
    .panelSaveRoleTable(_roleTable);
}

/**
 * Load backup configuration from the server and populate the
 * Data Backup card in Settings (frequency dropdown, last backup, sheet link).
 */
function loadBackupConfig() {
  google.script.run
    .withSuccessHandler(function(config) {
      var freqEl = $('backup-frequency');
      var lastEl = $('backup-last');
      var linkEl = $('backup-sheet-link');
      if (!freqEl) return;

      freqEl.value = config.frequency || 'weekly';

      if (config.lastBackup) {
        var d = new Date(config.lastBackup);
        lastEl.textContent = d.toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' })
          + ' at ' + d.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
      } else {
        lastEl.textContent = 'Never';
      }

      if (config.spreadsheetId) {
        linkEl.innerHTML = '<a href="https://docs.google.com/spreadsheets/d/' + esc(config.spreadsheetId)
          + '" target="_blank" style="font-size:13px;color:#b68d4c">Open backup spreadsheet \u2197</a>';
      } else {
        linkEl.innerHTML = '';
      }

      // Populate folder field
      var folderEl = $('backup-folder');
      var folderIdEl = $('backup-folder-id');
      var folderNameEl = $('backup-folder-name');
      if (folderEl && config.folderId) {
        folderEl.value = config.folderName || config.folderId;
        if (folderIdEl) folderIdEl.value = config.folderId;
        if (folderNameEl) folderNameEl.textContent = 'Folder ID: ' + config.folderId;
      } else if (folderNameEl) {
        folderNameEl.textContent = '';
      }
    })
    .withFailureHandler(function(e) {
      var lastEl = $('backup-last');
      if (lastEl) lastEl.textContent = 'Error loading config';
    })
    .panelGetBackupConfig();
}

/**
 * Save backup settings (frequency and Drive folder) from the Data Backup card.
 */
function saveBackupConfig() {
  var btn = $('backup-save-btn');
  btn.disabled = true; btn.textContent = 'Saving\u2026';

/** Open Google Picker to select a Drive folder for backups. */
function openBackupFolderPicker() {
  $('backup-status').innerHTML = '<div class="status-banner" style="background:#f0ede5;border:1px solid #d9d2c7">Loading picker…</div>';
  google.script.run
    .withSuccessHandler(function(config) {
      if (!config.apiKey || !config.appId) {
        $('backup-status').innerHTML = '<div class="status-banner error">Picker not configured. Set PICKER_API_KEY and PICKER_APP_ID in Script Properties.</div>';
        return;
      }
      _pickerConfig = config;
      var show = function() {
        $('backup-status').innerHTML = '';
        var folderView = new google.picker.DocsView(google.picker.ViewId.FOLDERS)
          .setSelectFolderEnabled(true)
          .setIncludeFolders(true);

        var picker = new google.picker.PickerBuilder()
          .addView(folderView)
          .setOAuthToken(_pickerConfig.token)
          .setDeveloperKey(_pickerConfig.apiKey)
          .setAppId(_pickerConfig.appId)
          .setCallback(function(data) {
            if (data.action !== google.picker.Action.PICKED) return;
            var doc = data.docs[0];
            $('backup-folder').value = doc.name;
            $('backup-folder-id').value = doc.id;
            $('backup-folder-name').textContent = 'Folder ID: ' + doc.id;
          })
          .setOrigin('https://script.google.com')
          .setTitle('Select backup folder')
          .build();
        picker.setVisible(true);
      };
      if (_pickerApiLoaded) { show(); }
      else { gapi.load('picker', function() { _pickerApiLoaded = true; show(); }); }
    })
    .withFailureHandler(function(e) {
      $('backup-status').innerHTML = '<div class="status-banner error">' + esc(e.message) + '</div>';
    })
    .panelGetPickerConfig();
}

/** Clear the backup folder selection. */
function clearBackupFolder() {
  $('backup-folder').value = '';
  $('backup-folder-id').value = '';
  $('backup-folder-name').textContent = '';
}

/**
 * Run a manual Notion data backup immediately. Shows a spinner while running,
 * then displays the result with a link to the backup spreadsheet.
 */
function runBackupNow() {
  var btn = $('backup-now-btn');
  btn.disabled = true; btn.textContent = 'Backing up\u2026';
  $('backup-status').innerHTML = '<div class="loading"><span class="spinner"></span> Backing up all Notion data\u2026 this may take a minute.</div>';

  google.script.run
    .withSuccessHandler(function(r) {
      btn.disabled = false; btn.textContent = 'Backup Now';
      if (r.success) {
        var d = new Date(r.lastBackup);
        var timeStr = d.toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' })
          + ' at ' + d.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });

        // Build status message based on partial/full success
        var totalTables = (r.tablesOk || 0) + (r.tablesErrored || 0);
        var hasWarnings = r.warnings && r.warnings.length > 0;
        var bannerClass = hasWarnings ? 'warning' : 'success';
        var msg = hasWarnings
          ? 'Backup complete: ' + r.tablesOk + ' of ' + totalTables + ' tables backed up.'
          : 'Backup complete!';
        var statusHtml = '<div class="status-banner ' + bannerClass + '">' + esc(msg)
          + ' <a href="' + esc(r.sheetUrl) + '" target="_blank" style="color:inherit;text-decoration:underline">Open spreadsheet \u2197</a></div>';

        // Show individual warnings
        if (hasWarnings) {
          statusHtml += '<div style="margin-top:8px;font-size:13px;color:#92400e">';
          r.warnings.forEach(function(w) {
            statusHtml += '<div>\u26A0 ' + esc(w) + '</div>';
          });
          statusHtml += '</div>';
        }

        $('backup-status').innerHTML = statusHtml;

        // Update the "Last Backup" display and link
        var lastEl = $('backup-last');
        if (lastEl) lastEl.textContent = timeStr;
        var linkEl = $('backup-sheet-link');
        if (linkEl && r.sheetUrl) {
          var idMatch = r.sheetUrl.match(/\/d\/([^\/]+)/);
          if (idMatch) {
            linkEl.innerHTML = '<a href="' + esc(r.sheetUrl) + '" target="_blank" style="font-size:13px;color:#b68d4c">Open backup spreadsheet \u2197</a>';
          }
        }
      } else {
        $('backup-status').innerHTML = '<div class="status-banner error">Backup failed: ' + esc(r.error) + '</div>';
      }
    })
    .withFailureHandler(function(e) {
      btn.disabled = false; btn.textContent = 'Backup Now';
      $('backup-status').innerHTML = '<div class="status-banner error">Backup failed: ' + esc(e.message) + '</div>';
    })
    .panelRunBackup();
}

/** Seed test records. Confirms before running. */
function runSeedTestData() {
  var btn = $('td-seed-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Seeding…'; }
  $('test-data-result').innerHTML = '<div class="loading"><span class="spinner"></span> Creating test client, project, and MSA… this may take 10&ndash;20 seconds.</div>';

  google.script.run
    .withSuccessHandler(function(r) {
      if (btn) { btn.disabled = false; btn.textContent = 'Seed Test Data'; }
      if (r.success) {
        _invalidate('clients','projects','agreements','invoices','quotes','expenses','payments','contractors');
        var msg = 'Test data seeded successfully.';
        if (r.msaError) msg += ' Note: MSA generation failed — ' + r.msaError;
        $('test-data-result').innerHTML = '<div class="status-banner ' + (r.msaError ? 'warning' : 'success') + '">' + esc(msg) + '</div>';
        loadTestDataStatus();
      } else {
        $('test-data-result').innerHTML = '<div class="status-banner error">Seed failed: ' + esc(r.error) + '</div>';
        loadTestDataStatus();
      }
    })
    .withFailureHandler(function(e) {
      if (btn) { btn.disabled = false; btn.textContent = 'Seed Test Data'; }
      $('test-data-result').innerHTML = '<div class="status-banner error">Seed failed: ' + esc(e.message) + '</div>';
    })
    .panelSeedTestData();
}

/** Tear down all test records. Shows inline confirmation before proceeding. */
function runTeardownTestData() {
  var resultEl = $('test-data-result');
  // Inline confirmation
  resultEl.innerHTML = '<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:12px;font-size:13px">'
    + '<strong style="color:#991b1b">Archive all test records and trash the Drive folder?</strong>'
    + '<div style="margin-top:8px;display:flex;gap:8px">'
    + '<button class="btn btn-danger btn-sm" onclick="_confirmTeardown()">Yes, Tear Down</button>'
    + '<button class="btn btn-secondary btn-sm" onclick="$(&quot;test-data-result&quot;).innerHTML=\'\'">Cancel</button>'
    + '</div></div>';
}

function _confirmTeardown() {
  var btn = $('td-teardown-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Tearing down…'; }
  $('test-data-result').innerHTML = '<div class="loading"><span class="spinner"></span> Archiving Notion records and trashing Drive folder…</div>';

  google.script.run
    .withSuccessHandler(function(r) {
      if (btn) { btn.disabled = false; btn.textContent = 'Teardown'; }
      _invalidate('clients','projects','agreements','invoices','quotes','expenses','payments','contractors');
      if (r.success) {
        $('test-data-result').innerHTML = '<div class="status-banner success">Teardown complete. All test records archived.</div>';
      } else {
        var msgs = r.errors ? r.errors.join('; ') : (r.error || 'Unknown error');
        $('test-data-result').innerHTML = '<div class="status-banner warning">Teardown finished with errors: ' + esc(msgs) + '</div>';
      }
      loadTestDataStatus();
    })
    .withFailureHandler(function(e) {
      if (btn) { btn.disabled = false; btn.textContent = 'Teardown'; }
      $('test-data-result').innerHTML = '<div class="status-banner error">Teardown failed: ' + esc(e.message) + '</div>';
    })
    .panelTeardownTestData();
}

/**
 * Export financial data to a Google Sheets spreadsheet.
 * Validates date range, then calls panelExportFinancialData().
 * Opens the resulting spreadsheet URL on success.
 */
function exportFinancialData() {
  var btn = $('export-btn');
  var statusEl = $('export-status');
  var startDate = $('export-start').value;
  var endDate = $('export-end').value;
  if (!startDate || !endDate) { statusEl.innerHTML = '<div class="status-banner error">Please select both start and end dates.</div>'; return; }

  btn.disabled = true; btn.textContent = 'Generating\u2026';
  statusEl.innerHTML = '<div class="loading"><span class="spinner"></span> Creating spreadsheet&hellip;</div>';

  google.script.run
    .withSuccessHandler(function(r) {
      btn.disabled = false; btn.textContent = 'Export to Spreadsheet';
      if (r.success) {
        statusEl.innerHTML = '<div class="status-banner success">Export complete! <a href="' + esc(r.sheetUrl) + '" target="_blank">Open Spreadsheet &rarr;</a></div>';
      } else {
        statusEl.innerHTML = '<div class="status-banner error">' + esc(r.error) + '</div>';
      }
    })
    .withFailureHandler(function(e) {
      btn.disabled = false; btn.textContent = 'Export to Spreadsheet';
      statusEl.innerHTML = '<div class="status-banner error">' + esc(e.message) + '</div>';
    })
    .panelExportFinancialData(startDate, endDate);
}

/** Toggle a FAQ item open/closed when its question row is clicked. */

/**
 * Build the HTML for a single FAQ accordion item.
 * @param {string} q - Question text (displayed in header).
 * @param {string} a - Answer HTML (displayed when expanded).

    + '</div><div class="faq-a">' + a + '</div></div>';
}

window.onload = function() {
  // Fetch current user role first, then boot the app
  google.script.run
    .withSuccessHandler(function(user) {
      _userEmail = user.email || '';
      _userRole  = user.role  || null;

      // Debug: show current user in topbar
      var userDiv = $('topbar-user');
      if (userDiv) userDiv.innerHTML = '<span style="color:#5a4a3a">' + esc(_userEmail || '(no email)') + '</span><br><span style="color:#d62828;font-weight:600">' + esc(_userRole || 'no role') + '</span>';
      console.log('panelGetCurrentUser:', JSON.stringify(user));

      // If not in role table at all, show access denied and stop
      if (!_userRole) {
        document.getElementById('content').innerHTML =
          '<div class="card"><div class="card-body" style="text-align:center;padding:60px 40px">'
          + '<div style="font-size:48px;margin-bottom:16px">🔒</div>'
          + '<h2 style="margin-bottom:8px">Access Denied</h2>'
          + '<p style="color:var(--text-muted);font-size:14px;max-width:340px;margin:0 auto">'
          + 'Your account (<strong>' + esc(_userEmail) + '</strong>) is not authorized to use this panel.<br><br>'
          + 'Contact the admin to request access.</p>'
          + '</div></div>';
        return;
      }

      // Hide nav items the role can't reach
      if (!_isPartner()) {
        ['nav-agreements','nav-invoices','nav-quotes','nav-expenses','nav-payments','nav-reports','nav-contractors'].forEach(function(id) {
          var el = document.getElementById(id);
          if (el) el.style.display = 'none';
        });
      }
      if (!_isAdmin()) {
        var settingsEl = document.getElementById('nav-settings');
        if (settingsEl) settingsEl.style.display = 'none';
      }

      // Auto health check (cached 24h, admin-only, runs in parallel)
      if (_isAdmin()) {
        google.script.run
          .withSuccessHandler(function(r) {
            if (!r.ok && r.issues && r.issues.length) {
              var banner = document.createElement('div');
              banner.id = 'health-banner';
              banner.style.cssText = 'background:#fef2f2;color:#991b1b;border-bottom:1px solid #fecaca;padding:10px 16px;font-size:13px;font-weight:600;position:fixed;top:0;left:0;right:0;z-index:9999';
              var issueHtml = r.issues.length === 1
                ? r.issues[0]
                : '<ul style="margin:4px 0 0;padding-left:20px;text-align:left;display:inline-block">'
                  + r.issues.map(function(i) { return '<li>' + i + '</li>'; }).join('')
                  + '</ul>';
              banner.innerHTML = '<div style="text-align:center">\u26A0 System Health Issues Detected</div>' + issueHtml
                + '<div style="text-align:center;margin-top:6px"><a href="#" onclick="navigateToRoot(\'settings\',\'Settings\');document.getElementById(\'health-banner\').remove();document.body.style.paddingTop=\'\';return false;" style="color:#991b1b;text-decoration:underline;font-size:12px">Run Full Health Check in Settings</a>'
                + ' &middot; <a href="#" onclick="document.getElementById(\'health-banner\').remove();document.body.style.paddingTop=\'\';return false;" style="color:#991b1b;text-decoration:underline;font-size:12px">Dismiss</a></div>';
              document.body.insertBefore(banner, document.body.firstChild);
              document.body.style.paddingTop = (banner.offsetHeight + 4) + 'px';
            }
          })
          .panelQuickPing();
      }

      navigateToRoot('dashboard', 'Dashboard');
    })
    .withFailureHandler(function(err) {
      console.log('panelGetCurrentUser failed:', err.message);
      document.getElementById('content').innerHTML =
        '<div class="card"><div class="card-body" style="text-align:center;padding:60px 40px">'
        + '<div style="font-size:48px;margin-bottom:16px">⚠️</div>'
        + '<h2 style="margin-bottom:8px">Could Not Load Panel</h2>'
        + '<p style="color:var(--text-muted);font-size:14px;max-width:360px;margin:0 auto">'
        + 'The panel failed to verify your session. This is usually a temporary issue.<br><br>'
        + '<strong>Error:</strong> ' + esc(err.message) + '<br><br>'
        + 'Reload the page to try again. If the problem persists, contact the admin.</p>'
        + '<button class="btn btn-primary" style="margin-top:20px" onclick="window.location.reload()">Reload</button>'
        + '</div></div>';
      // Do NOT call navigateToRoot — that would render the app without auth
    })
    .panelGetCurrentUser();

  // Inject iOS Home Screen meta tags + touch icon
  var iconUrl = 'https://drive.google.com/uc?id=1ReOAGhNBh5l4abfWLhTfaLEnrYhO9a-V&export=download&format=png';
  var touchIcon = document.createElement('link');
  touchIcon.rel = 'apple-touch-icon';
  touchIcon.href = iconUrl;
  document.head.appendChild(touchIcon);

  ['apple-mobile-web-app-capable:yes','apple-mobile-web-app-status-bar-style:black-translucent','apple-mobile-web-app-title:RH Ops'].forEach(function(m) {
    var parts = m.split(':');
    var meta = document.createElement('meta');
    meta.name = parts[0]; meta.content = parts[1];
    document.head.appendChild(meta);
  });
};
</script>
</body>
</html>
