function filterInvoiceList() {
  var search      = ($('inv-search')            ? $('inv-search').value            : '').toLowerCase();
  var statusF     = ($('inv-filter-status')     ? $('inv-filter-status').value     : '');
  var clientF     = ($('inv-filter-client')     ? $('inv-filter-client').value     : '');
  var projectF    = ($('inv-filter-project')    ? $('inv-filter-project').value    : '');
  var typeF       = ($('inv-filter-type')       ? $('inv-filter-type').value       : '');
  var fromF       = ($('inv-filter-from')       ? $('inv-filter-from').value       : '');
  var toF         = ($('inv-filter-to')         ? $('inv-filter-to').value         : '');
  var outstanding = ($('inv-filter-outstanding') ? $('inv-filter-outstanding').checked : false);

  var filtered = _cachedInvoices.filter(function(i) {
    if (outstanding && i.status !== 'Sent' && i.status !== 'Overdue') return false;
    if (statusF  && i.status      !== statusF)  return false;
    if (clientF  && i.clientName  !== clientF)  return false;
    if (projectF && i.projectName !== projectF) return false;
    if (typeF    && i.type        !== typeF)    return false;
    if (fromF    && i.issuedDate  <  fromF)     return false;
    if (toF      && i.issuedDate  >  toF)       return false;
    if (search) {
      var hay = ((i.invoiceId||'') + ' ' + (i.clientName||'') + ' ' + (i.projectName||'') + ' ' + (i.type||'') + ' ' + (i.status||'')).toLowerCase();
      if (hay.indexOf(search) === -1) return false;
    }
    return true;
  });

  var col = _invoiceSort.col, dir = _invoiceSort.dir;
  filtered.sort(function(a, b) {
    var va = a[col] || '', vb = b[col] || '';
    if (col === 'total') { va = parseFloat(va) || 0; vb = parseFloat(vb) || 0; }
    else if (typeof va === 'string') { va = va.toLowerCase(); vb = (vb || '').toLowerCase(); }
    if (va < vb) return dir === 'asc' ? -1 : 1;
    if (va > vb) return dir === 'asc' ? 1 : -1;
    return 0;
  });

  // Update stat cards to reflect filtered set
  if ($('inv-stat-total')) {
    var fTotal       = filtered.filter(function(i) { return i.status !== 'Void' && i.status !== 'Draft'; })
                               .reduce(function(s, i) { return s + (i.total || 0); }, 0);
    var fOutstanding = filtered.filter(function(i) { return i.status === 'Sent' || i.status === 'Overdue'; })
                               .reduce(function(s, i) { return s + (i.total || 0); }, 0);
    var fOverdue     = filtered.filter(function(i) { return i.status === 'Overdue'; })
                               .reduce(function(s, i) { return s + (i.total || 0); }, 0);
    var fPaid        = filtered.filter(function(i) { return i.status === 'Paid'; })
                               .reduce(function(s, i) { return s + (i.total || 0); }, 0);
    $('inv-stat-total').textContent       = formatMoney(fTotal);
    $('inv-stat-outstanding').textContent = formatMoney(fOutstanding);
    $('inv-stat-overdue').textContent     = formatMoney(fOverdue);
    $('inv-stat-paid').textContent        = formatMoney(fPaid);
  }

  var anyFilter = search || statusF || clientF || projectF || typeF || fromF || toF || outstanding;
  var html = '';
  if (!filtered.length) {
    html = '<tr><td colspan="8" class="empty">' + (anyFilter ? 'No invoices match your filters.' : 'No invoices found.') + '</td></tr>';
  } else {
    filtered.forEach(function(i) {
      var dueCls = (i.status === 'Overdue') ? ' style="color:#dc2626;font-weight:600"' : '';
      html += '<tr class="clickable-row" onclick="navigate(\'invoice\',\'' + jsEsc(i.invoiceId) + '\',{invoiceId:\'' + jsEsc(i.id) + '\',clientId:\'' + jsEsc(i.clientId||'') + '\'})">'
        + '<td>' + formatDate(i.issuedDate) + '</td>'
        + '<td class="hide-mobile"' + dueCls + '>' + formatDate(i.dueDate) + '</td>'
        + '<td><strong>' + esc(i.invoiceId) + '</strong></td>'
        + '<td class="hide-mobile">' + esc(i.clientName || '\u2014') + '</td>'
        + '<td class="hide-mobile">' + esc(i.projectName || '\u2014') + '</td>'
        + '<td class="hide-mobile">' + esc(i.type || '\u2014') + '</td>'
        + '<td>' + formatMoney(i.total) + '</td>'
        + '<td><span class="badge ' + badgeClass(i.status) + '">' + esc(i.status) + '</span></td>'
        + '</tr>';
    });
  }
  $('inv-tbody').innerHTML = html;
}

function toggleInvoiceSort(col) {
  if (_invoiceSort.col === col) { _invoiceSort.dir = _invoiceSort.dir === 'asc' ? 'desc' : 'asc'; }
  else { _invoiceSort = { col: col, dir: 'asc' }; }
  $('inv-thead').innerHTML = '<tr>'
    + sortableTh('Issued','issuedDate',_invoiceSort,'toggleInvoiceSort','')
    + sortableTh('Due','dueDate',_invoiceSort,'toggleInvoiceSort','hide-mobile')
    + sortableTh('Invoice ID','invoiceId',_invoiceSort,'toggleInvoiceSort','')
    + sortableTh('Client','clientName',_invoiceSort,'toggleInvoiceSort','hide-mobile')
    + sortableTh('Project','projectName',_invoiceSort,'toggleInvoiceSort','hide-mobile')
    + sortableTh('Type','type',_invoiceSort,'toggleInvoiceSort','hide-mobile')
    + sortableTh('Total','total',_invoiceSort,'toggleInvoiceSort','')
    + '<th>Status</th>'
    + '</tr>';
  filterInvoiceList();
}

// ── INVOICE DETAIL VIEW ────────────────────────────────────

/**
 * Render the invoice detail view.
 * Shows stat cards (Total/Paid/Balance), a payment progress bar,
 * invoice details + line items, payment history table, and a
 * Log Payment form. Fetches data via panelGetInvoiceDetails().
 * @param {string} invoiceId - Notion page ID.
 * @param {string} clientId  - Notion page ID of the parent client.
 */
var _invoiceViewCache = null;

function renderInvoiceView(invoiceId, clientId) {
  google.script.run
    .withSuccessHandler(function(data) {
      if (data.error) { showError(data.error); return; }
      var inv = data.invoice;
      var payments = data.payments || [];
      var isWithholdingClient = data.withholdingAgent || false;
      var withholdingRate = data.withholdingRate || 0.10;
      _invoiceViewCache = { inv: inv, payments: payments, clientName: data.clientName || '', withholdingAgent: isWithholdingClient, withholdingRate: withholdingRate };
      var cashTotal     = payments.reduce(function(s,p){return s+(p.amount||0);},0);
      var withheldTotal = payments.reduce(function(s,p){return s+(p.amountWithheld||0);},0);
      var settledTotal  = cashTotal + withheldTotal;
      var balance = Math.max(0, inv.total - settledTotal);

      var html = '<div class="stat-cards">'
        + '<div class="stat-card"><div class="stat-label">Total</div><div class="stat-value">' + formatMoney(inv.total) + '</div></div>'
        + '<div class="stat-card"><div class="stat-label">Cash Received</div><div class="stat-value" style="color:#16a34a">' + formatMoney(cashTotal) + '</div></div>'
        + (withheldTotal > 0 ? '<div class="stat-card"><div class="stat-label">Withheld</div><div class="stat-value" style="color:#d97706">' + formatMoney(withheldTotal) + '</div></div>' : '')
        + '<div class="stat-card"><div class="stat-label">Balance</div><div class="stat-value"' + (balance > 0 ? ' style="color:#dc2626"' : '') + '>' + formatMoney(balance) + '</div></div>'
        + '</div>';

      // Payment progress bar
      var pct = inv.total > 0 ? Math.min(100, Math.round((settledTotal / inv.total) * 100)) : 0;
      var pctColor = pct >= 100 ? 'green' : pct > 0 ? 'amber' : (inv.status === 'Overdue' ? 'red' : 'amber');
      html += '<div class="progress-wrap">'
        + '<div class="progress-label">'
        + '<span>' + pct + '% settled (' + formatMoney(settledTotal) + ' of ' + formatMoney(inv.total) + ')</span>'
        + '<span>' + payments.length + ' payment' + (payments.length !== 1 ? 's' : '') + '</span>'
        + '</div>'
        + '<div class="progress-track"><div class="progress-fill ' + pctColor + '" style="width:' + pct + '%"></div></div>'
        + '</div>';

      // Invoice details
      html += '<div class="grid-2">';
      html += '<div class="card"><div class="card-header"><h2>Invoice Details</h2>'
        + '<div style="display:flex;gap:6px">'
        + (_isPartner() ? '<button class="btn btn-secondary btn-sm" onclick="cloneInvoice()">Clone</button>' : '')
        + (_isAdmin() && inv.status !== 'Void' ? '<button class="btn btn-warning btn-sm" onclick="reviseInvoice()">Revise</button>' : '')
        + (_isAdmin() ? '<button class="btn btn-danger btn-sm" onclick="confirmDeleteInvoice(\'' + jsEsc(inv.id) + '\',\'' + jsEsc(inv.invoiceId) + '\',\'' + jsEsc(inv.driveLink || '') + '\')">Delete</button>' : '')
        + '</div>'
        + '</div><div class="card-body">'
        + detailRow('Invoice ID', inv.invoiceId)
        + detailRow('Client', data.clientName || '\u2014')
        + detailRow('Type', inv.type)
        + detailRow('Status', buildStatusSelect(inv.status, ['Draft','Sent','Paid','Overdue','Void'], 'invoice', inv.id), true)
        + detailRow('Issued', formatDate(inv.issuedDate))
        + detailRow('Due', formatDate(inv.dueDate))
        + (inv.paidDate ? detailRow('Paid', formatDate(inv.paidDate)) : '')
        + detailRow('Subtotal', formatMoney(inv.subtotal))
        + (inv.tax ? detailRow('Tax', formatMoney(inv.tax)) : '')
        + detailRow('Total', '<strong>' + formatMoney(inv.total) + '</strong>', true)
        + (inv.driveLink ? detailRow('PDF', '<a href="' + esc(inv.driveLink) + '" target="_blank">Open in Drive &rarr;</a>', true) : '')
        + (inv.notionUrl ? detailRow('Notion', '<a href="' + esc(inv.notionUrl) + '" target="_blank">Open in Notion &rarr;</a>', true) : '')
        + '</div></div>';

      // Line Items
      html += '<div class="card"><div class="card-header"><h2>Line Items</h2></div><div class="card-body">';
      if (inv.lineItems) {
        html += '<div style="font-size:13px;white-space:pre-wrap;color:#2f2f2f">' + esc(inv.lineItems) + '</div>';
      } else {
        html += '<div class="empty">No line items recorded.</div>';
      }
      html += '</div></div>';
      html += '</div>'; // end grid-2

      // Payments table
      html += '<div class="card" style="margin-top:20px"><div class="card-header"><h2>Payments (' + payments.length + ')</h2></div>';
      if (payments.length) {
        var hasWithheld = payments.some(function(p){ return (p.amountWithheld||0) > 0; });
        html += '<div class="table-wrap"><table class="data-table"><thead><tr>'
          + '<th>Payment ID</th><th>Description</th><th>Amount</th>'
          + (hasWithheld ? '<th>Withheld</th>' : '')
          + '<th>Method</th><th class="hide-mobile">Date</th></tr></thead><tbody>';
        payments.forEach(function(p) {
          html += '<tr><td><strong>' + esc(p.paymentId) + '</strong></td>'
            + '<td>' + esc(p.description) + '</td>'
            + '<td>' + formatMoney(p.amount) + '</td>'
            + (hasWithheld ? '<td>' + ((p.amountWithheld||0) > 0 ? '<span style="color:#d97706">' + formatMoney(p.amountWithheld) + '</span>' : '—') + '</td>' : '')
            + '<td>' + esc(p.method) + '</td>'
            + '<td class="hide-mobile">' + formatDate(p.paymentDate) + '</td></tr>';
        });
        html += '</tbody></table></div>';
      } else {
        html += '<div class="card-body"><div class="empty">No payments recorded.</div></div>';
      }
      html += '</div>';

      // Log Payment form — pre-calculate suggested withheld & check amounts for withholding clients
      // lp-amount = net/check amount (what you actually receive — client has already withheld)
      // lp-withheld = back-calculated from net × rate / (1 − rate); submit stores amount = net (check amount)
      var suggestedReceived = isWithholdingClient ? parseFloat((balance * (1 - withholdingRate)).toFixed(2)) : balance;
      var suggestedWithheld = isWithholdingClient ? parseFloat((balance - suggestedReceived).toFixed(2)) : 0;

      html += '<div class="card" style="margin-top:20px"><div class="card-header"><h2>Log Payment</h2></div><div class="card-body">'
        + (isWithholdingClient ? '<div id="lp-banner" class="status-banner" style="background:#fef3c7;border-color:#d97706;color:#92400e;margin-bottom:12px">Withholding client (' + Math.round(withholdingRate * 100) + '%) — withheld by client: ' + formatMoney(suggestedWithheld) + ', invoice credit: ' + formatMoney(balance) + '</div>' : '')
        + '<div class="form-group"><label class="form-label">Amount Received *</label><input class="form-input" id="lp-amount" type="number" step="0.01" value="' + (suggestedReceived > 0 ? suggestedReceived.toFixed(2) : '') + '" oninput="onInlinePaymentAmountChange()"></div>'
        + (isWithholdingClient
          ? '<div class="form-group"><label class="form-label">Amount Withheld by Client <span style="font-size:11px;color:#8c7e6e">(auto-calculated, editable)</span></label><input class="form-input" id="lp-withheld" type="number" step="0.01" value="' + suggestedWithheld.toFixed(2) + '" placeholder="0.00"></div>'
          : '<input type="hidden" id="lp-withheld" value="0">')
        + '<div class="form-group"><label class="form-label">Description</label><input class="form-input" id="lp-desc" placeholder="Check # / Txn ref / Description"></div>'
        + '<div class="form-row form-row-2">'
        + '<div class="form-group"><label class="form-label">Method</label><select class="form-select" id="lp-method">'
        + '<option>Check</option><option>ACH</option><option>Wire</option><option>Card</option><option>Other</option></select></div>'
        + '<div class="form-group"><label class="form-label">Date</label><input class="form-input" id="lp-date" type="date"></div></div>'
        + '<div class="form-group" class="form-check">'
        + '<input type="checkbox" id="lp-markpaid"' + (isWithholdingClient ? '' : ' checked') + '><label for="lp-markpaid" style="font-size:13px">Mark invoice as Paid</label></div>'
        + (inv.projectId ? '<div class="form-group form-check"><input type="checkbox" id="lp-close-project"><label for="lp-close-project" style="font-size:13px">Close project</label></div>' : '')
        + '<div id="lp-status" style="margin-bottom:8px"></div>'
        + '<button class="btn btn-primary" id="lp-submit" onclick="submitLogPayment(\'' + jsEsc(inv.id) + '\',\'' + jsEsc(inv.clientId||'') + '\',\'' + jsEsc(inv.projectId||'') + '\')">Log Payment</button>'
        + '</div></div>';

      html += '<div id="project-status" style="margin-top:20px"></div>';
      $('content').innerHTML = html;
      $('lp-date').value = new Date().toISOString().split('T')[0];
    })
    .withFailureHandler(function(e) { showError(e.message); })
    .panelGetInvoiceDetails(invoiceId);
}

/**
 * Validate and submit the Log Payment form → panelLogPayment().
 * Optionally marks the invoice as Paid based on checkbox state.
 * @param {string} invoiceId - Notion page ID of the invoice.
 * @param {string} clientId  - Notion page ID of the parent client.
 */
function submitLogPayment(invoiceId, clientId, projectId) {
  var desc = $('lp-desc') ? $('lp-desc').value.trim() : '';
  var net = parseFloat($('lp-amount').value);  // check amount (client already withheld)
  if (!net || net <= 0) { $('lp-status').innerHTML = '<div class="status-banner error">Amount must be > 0.</div>'; return; }
  if (!$('lp-date').value) { $('lp-status').innerHTML = '<div class="status-banner error">Date is required.</div>'; return; }
  var withheld  = parseFloat($('lp-withheld').value) || 0;
  var netAmount = net;  // stored amount IS the check amount
  var closeProject = !!($('lp-close-project') && $('lp-close-project').checked);
  $('lp-submit').disabled = true; $('lp-submit').textContent = 'Saving\u2026';
  google.script.run
    .withSuccessHandler(function(result) {
      if (result.success) {
        _ssClear(); _invalidate('payments', 'invoices');
        var msg = 'Payment logged.';
        if (result.invoiceUpdated) msg += ' Invoice marked as Paid.';
        if (result.projectClosed)  msg += ' Project closed.';
        if (result.projectCloseError) msg += ' (Could not close project: ' + esc(result.projectCloseError) + ')';
        $('lp-status').innerHTML = '<div class="status-banner success">' + msg + '</div>';
        $('lp-submit').textContent = 'Logged';
      } else {
        $('lp-status').innerHTML = '<div class="status-banner error">' + esc(result.error) + '</div>';
        $('lp-submit').disabled = false; $('lp-submit').textContent = 'Log Payment';
      }
    })
    .withFailureHandler(function(e) {
      $('lp-status').innerHTML = '<div class="status-banner error">' + esc(e.message) + '</div>';
      $('lp-submit').disabled = false; $('lp-submit').textContent = 'Log Payment';
    })
    .panelLogPayment({
      description: desc, invoiceId: invoiceId, clientId: clientId,
      amount: netAmount, amountWithheld: withheld,
      method: $('lp-method').value,
      paymentDate: $('lp-date').value, markPaid: $('lp-markpaid').checked,
      closeProject: closeProject, projectId: projectId || '',
    });
}

var _cachedExpenses = [];
var _expenseSort = { col: 'expenseDate', dir: 'desc' };
var _receiptFileId = null;
var _receiptFileUrl = null;
var _receiptPickerSource = false;

/** Render the All Expenses list view with stat cards, search, filters, and sortable table. */
function renderExpenses() {
  $('topbar-actions').innerHTML =
    '<button class="btn btn-primary" onclick="navigate(\'newExpense\',\'New Expense\',{})">+ Log Expense</button>';

  _expenseSort = { col: 'expenseDate', dir: 'desc' };

  if (_listCache.expenses !== null) { _doRenderExpenses(_listCache.expenses); return; }

  showLoading('Loading expenses…');
  google.script.run
    .withSuccessHandler(function(expenses) {
      if (expenses.error) { showError(expenses.error); return; }
      _listCache.expenses = expenses;
      _doRenderExpenses(expenses);
    })
    .withFailureHandler(function(e) { showError(e.message); })
    .panelGetAllExpenses();
}

function _doRenderExpenses(expenses) {
  _cachedExpenses = expenses;

  var totalAmt = expenses.reduce(function(sum, e) { return sum + (e.amount || 0); }, 0);
  var billable = expenses.filter(function(e) { return e.billable; });
  var billableAmt = billable.reduce(function(sum, e) { return sum + (e.amount || 0); }, 0);

  var html = '<div class="stat-cards">'
    + '<div class="stat-card"><div class="stat-label">Total Expenses</div><div class="stat-value">' + expenses.length + '</div></div>'
    + '<div class="stat-card"><div class="stat-label">Total Amount</div><div class="stat-value">' + formatMoney(totalAmt) + '</div></div>'
    + '<div class="stat-card"><div class="stat-label">Billable</div><div class="stat-value">' + formatMoney(billableAmt) + '</div></div>'
    + '</div>';

  html += '<div class="card">'
    + '<div class="card-header"><h2>All Expenses</h2>'
    + '<div class="search-wrap"><span class="s-icon">&#x1F50D;</span>'
    + '<input class="search-input" id="expense-search" placeholder="Search expenses\u2026" oninput="filterExpenseList()" '
    + 'onkeydown="if(event.key===\'Escape\'){this.value=\'\';filterExpenseList()}">'
    + '</div></div>'
    + '<div class="filter-bar">'
    + '<div class="filter-group"><span class="filter-label">Category</span>'
    + '<select class="filter-select" id="expense-filter-category" onchange="filterExpenseList()">'
    + '<option value="">All</option><option>Contractor Payments</option><option>Equipment</option><option>Software &amp; Subscriptions</option><option>Travel &amp; Meals</option><option>Professional Services</option><option>Marketing &amp; Advertising</option><option>Operations</option></select></div>'
    + '<div class="filter-group"><span class="filter-label">Type</span>'
    + '<select class="filter-select" id="expense-filter-type" onchange="filterExpenseList()">'
    + '<option value="">All</option><option>Project</option><option>Overhead</option></select></div>'
    + '<div class="filter-group"><span class="filter-label">Status</span>'
    + '<select class="filter-select" id="expense-filter-status" onchange="filterExpenseList()">'
    + '<option value="">All</option><option>Logged</option><option>Needs Review</option></select></div>';

  // Build client filter dynamically from the data
  var expClientNames = [];
  expenses.forEach(function(e) { if (e.clientName && expClientNames.indexOf(e.clientName) === -1) expClientNames.push(e.clientName); });
  expClientNames.sort();
  html += '<div class="filter-group"><span class="filter-label">Client</span>'
    + '<select class="filter-select" id="expense-filter-client" onchange="filterExpenseList()">'
    + '<option value="">All</option>';
  expClientNames.forEach(function(name) { html += '<option>' + esc(name) + '</option>'; });
  html += '</select></div></div>'
    + '<div class="table-wrap"><table class="data-table">'
    + '<thead id="expense-thead"><tr>'
    + sortableTh('Date','expenseDate',_expenseSort,'toggleExpenseSort','')
    + sortableTh('Description','description',_expenseSort,'toggleExpenseSort','')
    + sortableTh('Vendor','vendor',_expenseSort,'toggleExpenseSort','hide-mobile')
    + sortableTh('Category','category',_expenseSort,'toggleExpenseSort','hide-mobile')
    + sortableTh('Amount','amount',_expenseSort,'toggleExpenseSort','')
    + '<th class="hide-mobile">Billable</th>'
    + '<th class="hide-mobile">Receipt</th>'
    + '</tr></thead><tbody id="expense-tbody"></tbody>'
    + '</table></div></div>';

  $('content').innerHTML = html;
  filterExpenseList();
}

function filterExpenseList() {
  var search = ($('expense-search') ? $('expense-search').value : '').toLowerCase();
  var catF = $('expense-filter-category') ? $('expense-filter-category').value : '';
  var typeF = $('expense-filter-type') ? $('expense-filter-type').value : '';
  var statusF = $('expense-filter-status') ? $('expense-filter-status').value : '';
  var clientF = $('expense-filter-client') ? $('expense-filter-client').value : '';

  var filtered = _cachedExpenses.filter(function(e) {
    if (catF && e.category !== catF) return false;
    if (typeF && e.type !== typeF) return false;
    if (statusF && e.status !== statusF) return false;
    if (clientF && e.clientName !== clientF) return false;
    if (search) {
      var hay = (e.description + ' ' + e.vendor + ' ' + e.expenseId + ' ' + e.category + ' ' + (e.clientName || '')).toLowerCase();
      if (hay.indexOf(search) === -1) return false;
    }
    return true;
  });

  var col = _expenseSort.col, dir = _expenseSort.dir;
  filtered.sort(function(a, b) {
    var va = a[col] || '', vb = b[col] || '';
    if (col === 'amount') { va = parseFloat(va) || 0; vb = parseFloat(vb) || 0; }
    else if (typeof va === 'string') { va = va.toLowerCase(); vb = (vb || '').toLowerCase(); }
    if (va < vb) return dir === 'asc' ? -1 : 1;
    if (va > vb) return dir === 'asc' ? 1 : -1;
    return 0;
  });

  var html = '';
  if (!filtered.length) {
    html = '<tr><td colspan="7" class="empty">' + (search || catF || typeF || statusF || clientF ? 'No expenses match your filters.' : 'No expenses found.') + '</td></tr>';
  } else {
    var validCategories = ['Contractor Payments','Equipment','Software & Subscriptions','Travel & Meals','Professional Services','Marketing & Advertising','Operations'];
    filtered.forEach(function(e) {
      var uncategorized = !e.category || validCategories.indexOf(e.category) === -1;
      var catCell = uncategorized
        ? '<span class="badge" style="background:#fef3c7;color:#92400e;border:1px solid #d97706">⚠ ' + (e.category ? esc(e.category) : 'None') + '</span>'
        : '<span class="badge badge-' + badgeClass(e.category) + '">' + esc(e.category) + '</span>';
      html += '<tr class="clickable-row" onclick="navigate(\'expense\',\'' + jsEsc(e.description || e.expenseId) + '\',{expenseId:\'' + e.id + '\'})"'
        + (uncategorized ? ' style="background:#fffbeb"' : '') + '>'
        + '<td>' + formatDate(e.expenseDate) + '</td>'
        + '<td><strong>' + esc(e.description || e.expenseId) + '</strong></td>'
        + '<td class="hide-mobile">' + esc(e.vendor) + '</td>'
        + '<td class="hide-mobile">' + catCell + '</td>'
        + '<td>' + formatMoney(e.amount) + '</td>'
        + '<td class="hide-mobile">' + (e.billable ? '<span class="badge badge-success">Yes</span>' : '') + '</td>'
        + '<td class="hide-mobile">' + (e.receiptUrl ? '<a href="' + esc(e.receiptUrl) + '" target="_blank" class="action-btn" title="View Receipt" onclick="event.stopPropagation()">View</a>' : '') + '</td>'
        + '</tr>';
    });
  }
  $('expense-tbody').innerHTML = html;
}

function toggleExpenseSort(col) {
  if (_expenseSort.col === col) { _expenseSort.dir = _expenseSort.dir === 'asc' ? 'desc' : 'asc'; }
  else { _expenseSort = { col: col, dir: 'asc' }; }
  $('expense-thead').innerHTML = '<tr>'
    + sortableTh('Date','expenseDate',_expenseSort,'toggleExpenseSort','')
    + sortableTh('Description','description',_expenseSort,'toggleExpenseSort','')
    + sortableTh('Vendor','vendor',_expenseSort,'toggleExpenseSort','hide-mobile')
    + sortableTh('Category','category',_expenseSort,'toggleExpenseSort','hide-mobile')
    + sortableTh('Amount','amount',_expenseSort,'toggleExpenseSort','')
    + '<th class="hide-mobile">Billable</th>'
    + '<th class="hide-mobile">Receipt</th>'
    + '</tr>';
  filterExpenseList();
}

        + '<button type="button" class="btn btn-secondary" onclick="$(\'ee-receipt-file\').click()">' + (e.receiptUrl ? 'Replace Receipt' : 'Attach Receipt') + '</button>'
        + '<span id="ee-receipt-filename" style="font-size:12px;color:#8c7e6e"></span>'
        + '</div>'
        + '<div id="ee-receipt-status" style="margin-top:4px"></div>'
        + '</div>';

      // Notes
      html += '<div class="form-group"><label class="form-label">Notes</label><textarea class="form-textarea" id="ee-notes" rows="3">' + esc(e.notes) + '</textarea></div>';

      html += '<div id="ee-banner" style="margin-bottom:8px"></div>'
        + '<div style="display:flex;gap:8px">'
        + '<button class="btn btn-primary" id="ee-submit" onclick="submitEditExpense(\'' + e.id + '\')">Save Changes</button>'
        + '<button class="btn btn-secondary" onclick="goBack()">Cancel</button>'
        + '</div>'
        + '</div></div></div>';

      $('content').innerHTML = html;

      // Populate dropdowns async
      _loadEditExpenseDropdowns(e.clientId, e.projectId, e.contractorId);
    })
    .withFailureHandler(function(err) { showError(err.message); })
    .panelGetExpenseById(expensePageId);
}

/** Populate the client/project/contractor dropdowns on the Edit Expense form. */
function _loadEditExpenseDropdowns(selectedClientId, selectedProjectId, selectedContractorId) {
  cachedGetClients(function(clients) {
    if (!clients || clients.error) return;
    var sel = $('ee-client');
    clients.filter(function(c) { return c.status === 'Active' || c.id === selectedClientId; }).forEach(function(c) {
      var opt = document.createElement('option');
      opt.value = c.id; opt.textContent = c.name;
      if (c.id === selectedClientId) opt.selected = true;
      sel.appendChild(opt);
    });
  });
  cachedGetProjects(function(projects) {
    if (!projects || projects.error) return;
    window._allProjectsForExpEdit = projects;
    _filterEditExpenseProjects(selectedClientId, selectedProjectId);
  });
  cachedGetContractors(function(contractors) {
    if (!contractors || contractors.error) return;
    var sel = $('ee-contractor');
    contractors.forEach(function(c) {
      var opt = document.createElement('option');
      opt.value = c.id; opt.textContent = c.name;
      if (c.id === selectedContractorId) opt.selected = true;
      sel.appendChild(opt);
    });
  });
}

/** Re-populate the project dropdown filtered to the selected client. */
function _filterEditExpenseProjects(clientId, preserveId) {
  var sel = $('ee-project');
  if (!sel) return;
  var projects = window._allProjectsForExpEdit || [];
  sel.innerHTML = '<option value="">-- None --</option>';
  var filtered = clientId ? projects.filter(function(p) { return p.clientId === clientId; }) : projects;
  filtered.forEach(function(p) {
    var opt = document.createElement('option');
    opt.value = p.id; opt.textContent = p.name || p.projectId;
    if (p.id === preserveId) opt.selected = true;
    sel.appendChild(opt);
  });
}

/** Auto-set Type and re-filter projects when client changes in the Edit Expense form. */
function onEditExpenseClientChange() {
  var clientId = $('ee-client').value;
  var typeSel = $('ee-type');
  if (typeSel) typeSel.value = clientId ? 'Project' : 'Overhead';
  _filterEditExpenseProjects(clientId, null);
}

/** Handle file selection for receipt replacement in Edit Expense form. */
function onEditReceiptSelected() {
  var input = $('ee-receipt-file');
  if (!input || !input.files || !input.files[0]) return;
  var file = input.files[0];
  $('ee-receipt-filename').textContent = file.name;
  window._pendingEditReceiptFile = file;
  uploadEditReceipt();
}

/** Upload selected receipt to staging and store fileId/URL for submit. */
function uploadEditReceipt() {
  var file = window._pendingEditReceiptFile;
  if (!file) return;
  $('ee-receipt-status').innerHTML = '<div class="status-banner" style="background:#f0ede5;border:1px solid #d9d2c7">Uploading receipt…</div>';
  var reader = new FileReader();
  reader.onload = function(evt) {
    var base64 = evt.target.result.split(',')[1];
    google.script.run
      .withSuccessHandler(function(result) {
        if (result.success) {
          _receiptFileId = result.fileId;
          _receiptFileUrl = result.fileUrl;
          _receiptPickerSource = false;
          $('ee-receipt-filename').textContent = file.name + ' ✓';
          $('ee-receipt-status').innerHTML = '<div class="status-banner success">Receipt uploaded — will be saved on submit.</div>';
        } else {
          $('ee-receipt-status').innerHTML = '<div class="status-banner error">Upload failed: ' + esc(result.error || 'Unknown error') + '</div>';
        }
      })
      .withFailureHandler(function(err) {
        $('ee-receipt-status').innerHTML = '<div class="status-banner error">Upload failed: ' + esc(err.message) + '</div>';
      })
      .panelUploadAndExtractReceipt({ base64: base64, fileName: file.name, mimeType: file.type });
  };
  reader.readAsDataURL(file);
}

function submitEditExpense(expensePageId) {
  var description = $('ee-description').value.trim();
  var amount = parseFloat($('ee-amount').value);
  if (!description) { $('ee-banner').innerHTML = '<div class="status-banner error">Description is required.</div>'; return; }
  if (!amount || amount <= 0) { $('ee-banner').innerHTML = '<div class="status-banner error">Amount must be greater than zero.</div>'; return; }

  $('ee-submit').disabled = true; $('ee-submit').textContent = 'Saving…';
  google.script.run
    .withSuccessHandler(function(result) {
      if (result.success) {
        _ssClear(); _invalidate('expenses');
        $('ee-banner').innerHTML = '<div class="status-banner success">Expense updated.</div>';
        $('ee-submit').textContent = 'Saved';
        setTimeout(function() { goBack(); }, 600);
      } else {
        $('ee-banner').innerHTML = '<div class="status-banner error">' + esc(result.error) + '</div>';
        $('ee-submit').disabled = false; $('ee-submit').textContent = 'Save Changes';
      }
    })
    .withFailureHandler(function(err) {
      $('ee-banner').innerHTML = '<div class="status-banner error">' + esc(err.message) + '</div>';
      $('ee-submit').disabled = false; $('ee-submit').textContent = 'Save Changes';
    })
    .panelUpdateExpense(expensePageId, {
      description: description,
      amount: amount,
      expenseDate: $('ee-date').value || '',
      vendor: $('ee-vendor').value.trim(),
      category: $('ee-category').value,
      type: $('ee-type').value,
      status: $('ee-status').value,
      billable: $('ee-billable').checked,
      clientId: $('ee-client').value || '',
      projectId: $('ee-project').value || '',
      contractorId: $('ee-contractor').value || '',
      receiptUrl: _receiptFileUrl || ($('ee-receipt-url') ? $('ee-receipt-url').value : ''),
      receiptFileId: _receiptFileId || '',
      pickerSource: _receiptPickerSource,
      notes: $('ee-notes').value.trim(),
    });
}

/** Load client, project, and contractor dropdowns for the expense form. */
function _loadExpenseDropdowns(data) {
  cachedGetClients(function(clients) {
    if (!clients || clients.error) return;
    var sel = $('exp-client');
    clients.filter(function(c) { return c.status === 'Active'; }).forEach(function(c) {
      var opt = document.createElement('option');
      opt.value = c.id; opt.textContent = c.name;
      sel.appendChild(opt);
    });
    if (data && data.clientId) { sel.value = data.clientId; onExpenseClientChange(); }
  });
  cachedGetProjects(function(projects) {
    if (!projects || projects.error) return;
    window._allProjects = projects;
    onExpenseClientChange();
    if (data && data.projectId) $('exp-project').value = data.projectId;
  });
  cachedGetContractors(function(contractors) {
    if (!contractors || contractors.error) return;
    var sel = $('exp-contractor');
    contractors.forEach(function(c) {
      var opt = document.createElement('option');
      opt.value = c.id; opt.textContent = c.name;
      sel.appendChild(opt);
    });
  });
}

/** Filter projects dropdown based on selected client. */
function onExpenseClientChange() {
  var clientId = $('exp-client').value;
  var projSel = $('exp-project');
  projSel.innerHTML = '<option value="">None</option>';

  // Auto-set type based on client selection
  if (clientId) {
    $('exp-type').value = 'Project';
  } else {
    $('exp-type').value = 'Overhead';
  }

  if (clientId && window._allProjects) {
    window._allProjects.forEach(function(p) {
      if (p.clientId === clientId) {
        var opt = document.createElement('option');
        opt.value = p.id; opt.textContent = p.name;
        projSel.appendChild(opt);
      }
    });
  }
}

/** Handle receipt file selection — store in memory, show filename. No upload yet. */
function onReceiptFileSelected() {
  var input = $('receipt-file');
  if (!input.files || !input.files[0]) return;

  var file = input.files[0];
  var maxSize = 10 * 1024 * 1024; // 10MB limit
  if (file.size > maxSize) {
    $('receipt-status').innerHTML = '<div class="status-banner error">File too large. Maximum size is 10MB.</div>';
    return;
  }

  window._pendingReceiptFile = file;
  $('receipt-file-name').textContent = file.name + ' (' + (file.size / 1024).toFixed(0) + ' KB)';
  $('receipt-status').innerHTML = '';

  // Show the Extract button
  $('receipt-extract-btn').style.display = '';
}

/** Upload receipt to Drive (correct folder based on current client) and extract via AI. */
function uploadAndExtractReceipt() {
  var file = window._pendingReceiptFile;

  // If already uploaded, just re-extract
  if (_receiptFileId && !file) {
    retryExtraction();
    return;
  }

  if (!file) {
    $('receipt-status').innerHTML = '<div class="status-banner error">No file selected.</div>';
    return;
  }

  $('receipt-extract-btn').disabled = true;
  $('receipt-extract-btn').textContent = 'Uploading & extracting\u2026';
  $('receipt-status').innerHTML = '<div class="status-banner" style="background:#f0ede5;border:1px solid #d9d2c7">Uploading to Drive and extracting data\u2026 <span class="loading-dots"></span></div>';

  var reader = new FileReader();
  reader.onload = function(e) {
    var base64 = e.target.result.split(',')[1];
    google.script.run
      .withSuccessHandler(onReceiptProcessed)
      .withFailureHandler(function(err) {
        $('receipt-status').innerHTML = '<div class="status-banner error">Upload failed: ' + esc(err.message) + '</div>';
        $('receipt-extract-btn').disabled = false;
        $('receipt-extract-btn').textContent = 'Extract Data';
      })
      .panelUploadAndExtractReceipt({
        base64: base64,
        fileName: file.name,
        mimeType: file.type,
        clientId: $('exp-client').value || null,
      });
  };
  reader.readAsDataURL(file);
}

/** Fill form fields from extracted data. Shared by initial extract and retry. */
function _applyExtractedData(d) {
  if (d.description) $('exp-description').value = d.description;
  if (d.vendor) $('exp-vendor').value = d.vendor;
  if (d.amount) $('exp-amount').value = parseFloat(d.amount).toFixed(2);
  if (d.date) $('exp-date').value = d.date;
  if (d.category) {
    var catSel = $('exp-category');
    for (var i = 0; i < catSel.options.length; i++) {
      if (catSel.options[i].value === d.category) { catSel.value = d.category; break; }
    }
    $('exp-contractor-group').style.display = d.category === 'Contractor Payments' ? '' : 'none';
  }
  if (d.notes) $('exp-notes').value = d.notes;
}

/** Handle receipt processing result — fill form with extracted data. */
function onReceiptProcessed(result) {
  // Clear pending file — it's been uploaded
  window._pendingReceiptFile = null;
  $('receipt-extract-btn').disabled = false;
  $('receipt-extract-btn').textContent = 'Re-extract';

  if (!result.success) {
    $('receipt-status').innerHTML = '<div class="status-banner error">' + esc(result.error) + '</div>';
    return;
  }

  _receiptFileId = result.fileId;
  _receiptFileUrl = result.fileUrl;
  _receiptPickerSource = !!result.pickerSource;

  // Show receipt preview
  $('receipt-preview').style.display = '';
  $('receipt-preview-content').innerHTML = '<a href="' + esc(result.fileUrl) + '" target="_blank">' + esc(result.fileName) + '</a>';

  if (result.extracted) {
    _applyExtractedData(result.extracted);
    $('receipt-status').innerHTML = '<div class="status-banner success">Data extracted. Please review and confirm below.</div>';
  } else {
    var msg = result.extractionError ? 'Could not extract data: ' + result.extractionError + ' ' : '';
    $('receipt-status').innerHTML = '<div class="status-banner" class="status-banner warning">'
      + msg + 'Receipt uploaded. Fill in the details manually or click Re-extract to try again.</div>';
  }
}

/** Retry AI extraction on an already-uploaded receipt. */
function retryExtraction() {
  if (!_receiptFileId) { $('receipt-status').innerHTML = '<div class="status-banner error">No receipt file to extract from.</div>'; return; }

  $('receipt-extract-btn').disabled = true;
  $('receipt-extract-btn').textContent = 'Re-extracting\u2026';
  $('receipt-status').innerHTML = '<div class="status-banner" style="background:#f0ede5;border:1px solid #d9d2c7">Re-extracting data\u2026 <span class="loading-dots"></span></div>';

  google.script.run
    .withSuccessHandler(function(result) {
      $('receipt-extract-btn').disabled = false;
      $('receipt-extract-btn').textContent = 'Re-extract';
      if (result.success && result.data) {
        _applyExtractedData(result.data);
        $('receipt-status').innerHTML = '<div class="status-banner success">Data re-extracted successfully.</div>';
      } else {
        $('receipt-status').innerHTML = '<div class="status-banner" class="status-banner warning">'
          + 'Extraction failed: ' + esc(result.error || 'Unknown error') + '. Click Re-extract to try again.</div>';
      }
    })
    .withFailureHandler(function(e) {
      $('receipt-extract-btn').disabled = false;
      $('receipt-extract-btn').textContent = 'Re-extract';
      $('receipt-status').innerHTML = '<div class="status-banner error">Retry failed: ' + esc(e.message) + '</div>';
    })
    .panelReExtractReceipt(_receiptFileId);
}

// ── Google Picker ───────────────────────────────────────────
var _pickerApiLoaded = false;
var _pickerConfig = null;

/** Open Google Picker to select a receipt file from Drive. */
function openDrivePicker() {
  $('receipt-status').innerHTML = '<div class="status-banner" style="background:#f0ede5;border:1px solid #d9d2c7">Loading Drive picker\u2026</div>';

  google.script.run
    .withSuccessHandler(function(config) {
      if (!config.apiKey || !config.appId) {
        $('receipt-status').innerHTML = '<div class="status-banner error">Google Picker not configured. Set PICKER_API_KEY and PICKER_APP_ID in Script Properties.</div>';
        return;
      }
      _pickerConfig = config;
      if (_pickerApiLoaded) {
        _showPicker();
      } else {
        gapi.load('picker', function() {
          _pickerApiLoaded = true;
          _showPicker();
        });
      }
    })
    .withFailureHandler(function(e) {
      $('receipt-status').innerHTML = '<div class="status-banner error">Could not load picker config: ' + esc(e.message) + '</div>';
    })
    .panelGetPickerConfig();
}

/** Build and display the Google Picker dialog. */
function _showPicker() {
  $('receipt-status').innerHTML = '';

  var docsView = new google.picker.DocsView()
    .setIncludeFolders(true)
    .setMimeTypes('image/jpeg,image/png,image/webp,image/gif,application/pdf');

  var picker = new google.picker.PickerBuilder()
    .addView(docsView)
    .setOAuthToken(_pickerConfig.token)
    .setDeveloperKey(_pickerConfig.apiKey)
    .setAppId(_pickerConfig.appId)
    .setCallback(onPickerCallback)
    .setOrigin('https://script.google.com')
    .setTitle('Select a receipt file')
    .setSelectableMimeTypes('image/jpeg,image/png,image/webp,image/gif,application/pdf')
    .build();
  picker.setVisible(true);
}

/** Handle Picker selection callback. */
function onPickerCallback(data) {
  if (data.action !== google.picker.Action.PICKED) return;

  var doc = data.docs[0];
  var fileId = doc.id;
  var fileName = doc.name;

  // Show status and process
  $('receipt-file-name').textContent = fileName + ' (from Drive)';
  $('receipt-extract-btn').style.display = 'none'; // hide extract btn during processing
  $('receipt-status').innerHTML = '<div class="status-banner" style="background:#f0ede5;border:1px solid #d9d2c7">Extracting data from Drive file\u2026 <span class="loading-dots"></span></div>';

  google.script.run
    .withSuccessHandler(function(result) {
      // Reuse the same handler as the upload flow
      onReceiptProcessed(result);
    })
    .withFailureHandler(function(e) {
      $('receipt-status').innerHTML = '<div class="status-banner error">Picker processing failed: ' + esc(e.message) + '</div>';
      $('receipt-extract-btn').style.display = '';
    })
    .panelPickerExtractReceipt({
      fileId: fileId,
      fileName: fileName,
      clientId: $('exp-client').value || null,
    });
}

    + '</div>';
}

/** Handle W-9 file selection — read and upload immediately. */
function onW9FileSelected(prefix) {
  var input = $(prefix + '-w9-file');
  if (!input.files || !input.files[0]) return;

  var file = input.files[0];
  if (file.size > 10 * 1024 * 1024) {
    $(prefix + '-w9-status').innerHTML = '<div class="status-banner error">File too large. Max 10MB.</div>';
    return;
  }

  $(prefix + '-w9-status').innerHTML = '<div class="status-banner" style="background:#f0ede5;border:1px solid #d9d2c7">Uploading ' + esc(file.name) + '\u2026 <span class="loading-dots"></span></div>';

  var contractorName = $(prefix + '-name') ? $(prefix + '-name').value.trim() : 'Contractor';

  var reader = new FileReader();
  reader.onload = function(e) {
    var base64 = e.target.result.split(',')[1];
    google.script.run
      .withSuccessHandler(function(result) {
        if (result.success) {
          $(prefix + '-w9').value = result.fileUrl;
          $(prefix + '-w9-status').innerHTML = '<div class="status-banner success">W-9 uploaded: ' + esc(result.fileName) + '</div>';
        } else {
          $(prefix + '-w9-status').innerHTML = '<div class="status-banner error">Upload failed: ' + esc(result.error) + '</div>';
        }
      })
      .withFailureHandler(function(err) {
        $(prefix + '-w9-status').innerHTML = '<div class="status-banner error">Upload failed: ' + esc(err.message) + '</div>';
      })
      .panelUploadW9({
        base64: base64,
        fileName: file.name,
        mimeType: file.type,
        contractorName: contractorName,
      });
  };
  reader.readAsDataURL(file);
}

/** Open Google Picker to select an existing W-9 from Drive. */
function openW9Picker(prefix) {
  $(prefix + '-w9-status').innerHTML = '<div class="status-banner" style="background:#f0ede5;border:1px solid #d9d2c7">Loading picker\u2026</div>';

  google.script.run
    .withSuccessHandler(function(config) {
      if (!config.apiKey || !config.appId) {
        $(prefix + '-w9-status').innerHTML = '<div class="status-banner error">Picker not configured. Set PICKER_API_KEY and PICKER_APP_ID in Script Properties.</div>';
        return;
      }
      _pickerConfig = config;
      var show = function() {
        $(prefix + '-w9-status').innerHTML = '';
        var docsView = new google.picker.DocsView()
          .setIncludeFolders(true)
          .setMimeTypes('image/jpeg,image/png,image/webp,image/gif,application/pdf');

        var picker = new google.picker.PickerBuilder()
          .addView(docsView)
          .setOAuthToken(_pickerConfig.token)
          .setDeveloperKey(_pickerConfig.apiKey)
          .setAppId(_pickerConfig.appId)
          .setCallback(function(data) {
            if (data.action !== google.picker.Action.PICKED) return;
            var doc = data.docs[0];
            $(prefix + '-w9').value = doc.url;
            $(prefix + '-w9-status').innerHTML = '<div class="status-banner success">Selected: ' + esc(doc.name) + '</div>';
          })
          .setOrigin('https://script.google.com')
          .setTitle('Select W-9 file')
          .setSelectableMimeTypes('image/jpeg,image/png,image/webp,image/gif,application/pdf')
          .build();
        picker.setVisible(true);
      };

      if (_pickerApiLoaded) { show(); }
      else { gapi.load('picker', function() { _pickerApiLoaded = true; show(); }); }
    })
    .withFailureHandler(function(e) {
      $(prefix + '-w9-status').innerHTML = '<div class="status-banner error">' + esc(e.message) + '</div>';
    })
    .panelGetPickerConfig();
}

/** Submit the expense form. */
function submitNewExpense() {
  var description = $('exp-description').value.trim();
  var amount = parseFloat($('exp-amount').value);

  if (!description) { $('exp-status').innerHTML = '<div class="status-banner error">Description is required.</div>'; return; }
  if (!amount || amount <= 0) { $('exp-status').innerHTML = '<div class="status-banner error">Amount must be greater than zero.</div>'; return; }
  if (!$('exp-date').value) { $('exp-status').innerHTML = '<div class="status-banner error">Date is required.</div>'; return; }

  $('exp-submit').disabled = true; $('exp-submit').textContent = 'Logging\u2026';

  google.script.run
    .withSuccessHandler(function(result) {
      if (result.success) {
        _ssClear(); _invalidate('expenses');
        $('exp-status').innerHTML = '<div class="status-banner success">Expense logged: ' + esc(result.expense.expenseId) + '</div>';
        $('exp-submit').textContent = 'Logged';
        setTimeout(function() { navigateToRoot('expenses', 'Expenses'); }, 800);
      } else {
        $('exp-status').innerHTML = '<div class="status-banner error">' + esc(result.error) + '</div>';
        $('exp-submit').disabled = false; $('exp-submit').textContent = 'Log Expense';
      }
    })
    .withFailureHandler(function(e) {
      $('exp-status').innerHTML = '<div class="status-banner error">' + esc(e.message) + '</div>';
      $('exp-submit').disabled = false; $('exp-submit').textContent = 'Log Expense';
    })
    .panelLogExpenseFromReceipt({
      description:    description,
      vendor:         $('exp-vendor').value.trim(),
      amount:         amount,
      expenseDate:    $('exp-date').value,
      category:       $('exp-category').value,
      type:           $('exp-type').value,
      clientId:       $('exp-client').value || '',
      projectId:      $('exp-project').value || '',
      contractorId:   $('exp-contractor').value || '',
      billable:       $('exp-billable').checked,
      receiptFileId:  _receiptFileId || '',
      pickerSource:   _receiptPickerSource,
      receiptUrl:     '',
      notes:          $('exp-notes').value.trim(),
    });
}

var _cachedPayments = [];
var _paymentSort = { col: 'paymentDate', dir: 'desc' };
var _paymentReceiptFileId = null;
var _paymentReceiptFileUrl = null;
var _paymentReceiptPickerSource = false;

/**
 * Render the Payments list view.
 */
function renderPayments() {
  $('topbar-actions').innerHTML =
    '<button class="btn btn-primary" onclick="navigate(\'newPayment\',\'New Payment\',{})">+ Log Payment</button>';

  _paymentSort = { col: 'paymentDate', dir: 'desc' };

  if (_listCache.payments !== null) { _doRenderPayments(_listCache.payments); return; }

  showLoading('Loading payments…');
  google.script.run
    .withSuccessHandler(function(payments) {
      if (payments.error) { showError(payments.error); return; }
      _listCache.payments = payments;
      _doRenderPayments(payments);
    })
    .withFailureHandler(function(e) { showError(e.message); })
    .panelGetAllPayments();
}

function _doRenderPayments(payments) {
  _cachedPayments = payments;

  // Build year list from data
  var years = [];
  payments.forEach(function(p) {
    if (p.paymentDate) {
      var yr = p.paymentDate.substring(0, 4);
      if (years.indexOf(yr) === -1) years.push(yr);
    }
  });
  years.sort().reverse();

  // Build client list from data
  var payClientNames = [];
  payments.forEach(function(p) {
    if (p.clientName && payClientNames.indexOf(p.clientName) === -1) payClientNames.push(p.clientName);
  });
  payClientNames.sort();

  var html = '<div id="payment-stat-cards" class="stat-cards"></div>';

  html += '<div class="card">'
    + '<div class="card-header"><h2>All Payments</h2>'
    + '<div class="search-wrap"><span class="s-icon">&#x1F50D;</span>'
    + '<input class="search-input" id="payment-search" placeholder="Search payments\u2026" oninput="filterPaymentList()" '
    + 'onkeydown="if(event.key===\'Escape\'){this.value=\'\';filterPaymentList()}">'
    + '</div></div>'
    + '<div class="filter-bar">'
    + '<div class="filter-group"><span class="filter-label">Year</span>'
    + '<select class="filter-select" id="payment-filter-year" onchange="filterPaymentList()">'
    + '<option value="">All Years</option>';
  years.forEach(function(yr) { html += '<option>' + yr + '</option>'; });
  html += '</select></div>'
    + '<div class="filter-group"><span class="filter-label">Method</span>'
    + '<select class="filter-select" id="payment-filter-method" onchange="filterPaymentList()">'
    + '<option value="">All</option><option>Check</option><option>ACH</option><option>Wire</option><option>Card</option><option>Zelle</option><option>Other</option></select></div>'
    + '<div class="filter-group"><span class="filter-label">Client</span>'
    + '<select class="filter-select" id="payment-filter-client" onchange="filterPaymentList()">'
    + '<option value="">All</option>';
  payClientNames.forEach(function(name) { html += '<option>' + esc(name) + '</option>'; });
  html += '</select></div>'
    + '<div class="filter-group" style="display:flex;align-items:center;gap:6px">'
    + '<input type="checkbox" id="payment-filter-withheld" onchange="filterPaymentList()">'
    + '<label for="payment-filter-withheld" class="filter-label" style="cursor:pointer;margin:0">Withholding only</label>'
    + '</div>'
    + '</div>'
    + '<div class="table-wrap"><table class="data-table">'
    + '<thead id="payment-thead"><tr>'
    + sortableTh('Date','paymentDate',_paymentSort,'togglePaymentSort','')
    + sortableTh('Client','clientName',_paymentSort,'togglePaymentSort','')
    + sortableTh('Invoice','invoiceNumber',_paymentSort,'togglePaymentSort','hide-mobile')
    + sortableTh('Method','method',_paymentSort,'togglePaymentSort','hide-mobile')
    + sortableTh('Amount','amount',_paymentSort,'togglePaymentSort','')
    + '<th class="hide-mobile">Receipt</th>'
    + '</tr></thead><tbody id="payment-tbody"></tbody>'
    + '</table></div></div>';

  $('content').innerHTML = html;
  filterPaymentList();
}

function filterPaymentList() {
  var search      = ($('payment-search')          ? $('payment-search').value          : '').toLowerCase();
  var yearF       = $('payment-filter-year')       ? $('payment-filter-year').value       : '';
  var methodF     = $('payment-filter-method')     ? $('payment-filter-method').value     : '';
  var clientF     = $('payment-filter-client')     ? $('payment-filter-client').value     : '';
  var withheldOnly = $('payment-filter-withheld')  ? $('payment-filter-withheld').checked : false;

  var filtered = _cachedPayments.filter(function(p) {
    if (yearF   && (!p.paymentDate || p.paymentDate.substring(0, 4) !== yearF)) return false;
    if (methodF && p.method !== methodF) return false;
    if (clientF && p.clientName !== clientF) return false;
    if (withheldOnly && !((p.amountWithheld || 0) > 0)) return false;
    if (search) {
      var hay = ((p.description || '') + ' ' + (p.paymentId || '') + ' ' + (p.method || '') + ' ' + (p.notes || '') + ' ' + (p.clientName || '') + ' ' + (p.invoiceNumber || '')).toLowerCase();
      if (hay.indexOf(search) === -1) return false;
    }
    return true;
  });

  // Update stat cards to reflect current filter
  var fAmt      = filtered.reduce(function(s, p) { return s + (p.amount || 0); }, 0);
  var fWithheld = filtered.reduce(function(s, p) { return s + (p.amountWithheld || 0); }, 0);
  var statsHtml = '<div class="stat-card"><div class="stat-label">Payments</div><div class="stat-value">' + filtered.length + '</div></div>'
    + '<div class="stat-card"><div class="stat-label">Cash Received</div><div class="stat-value">' + formatMoney(fAmt) + '</div></div>'
    + (fWithheld > 0 ? '<div class="stat-card"><div class="stat-label">Withheld</div><div class="stat-value" style="color:#d97706">' + formatMoney(fWithheld) + '</div></div>' : '')
    + (fWithheld > 0 ? '<div class="stat-card"><div class="stat-label">Total Received</div><div class="stat-value">' + formatMoney(fAmt + fWithheld) + '</div></div>' : '');
  if ($('payment-stat-cards')) $('payment-stat-cards').innerHTML = statsHtml;

  var col = _paymentSort.col, dir = _paymentSort.dir;
  filtered.sort(function(a, b) {
    var va = a[col] || '', vb = b[col] || '';
    if (col === 'amount') { va = parseFloat(va) || 0; vb = parseFloat(vb) || 0; }
    else if (typeof va === 'string') { va = va.toLowerCase(); vb = (vb || '').toLowerCase(); }
    if (va < vb) return dir === 'asc' ? -1 : 1;
    if (va > vb) return dir === 'asc' ? 1 : -1;
    return 0;
  });

  var anyFilter = search || yearF || methodF || clientF || withheldOnly;
  var html = '';
  if (!filtered.length) {
    html = '<tr><td colspan="6" class="empty">' + (anyFilter ? 'No payments match your filters.' : 'No payments found.') + '</td></tr>';
  } else {
    filtered.forEach(function(p) {
      var invCell = p.invoiceNumber
        ? '<a onclick="event.stopPropagation();navigate(\'invoice\',\'' + jsEsc(p.invoiceNumber) + '\',{invoiceId:\'' + jsEsc(p.invoiceId) + '\',clientId:\'' + jsEsc(p.clientId) + '\'})" style="cursor:pointer;text-decoration:underline">' + esc(p.invoiceNumber) + '</a>'
        : '\u2014';
      var amtCell = formatMoney(p.amount);
      if ((p.amountWithheld || 0) > 0) {
        amtCell += '<div style="font-size:11px;color:#d97706;margin-top:1px">+' + formatMoney(p.amountWithheld) + ' withheld</div>';
      }
      html += '<tr class="clickable-row" onclick="navigate(\'payment\',\'' + jsEsc(p.clientName || p.paymentId) + '\',{paymentId:\'' + p.id + '\'})">'
        + '<td>' + formatDate(p.paymentDate) + '</td>'
        + '<td><strong>' + esc(p.clientName || '\u2014') + '</strong></td>'
        + '<td class="hide-mobile">' + invCell + '</td>'
        + '<td class="hide-mobile">' + esc(p.method) + '</td>'
        + '<td>' + amtCell + '</td>'
        + '<td class="hide-mobile">' + (p.receiptUrl ? '<a href="' + esc(p.receiptUrl) + '" target="_blank" class="action-btn" title="View Receipt" onclick="event.stopPropagation()">View</a>' : '') + '</td>'
        + '</tr>';
    });
  }
  $('payment-tbody').innerHTML = html;
}

function togglePaymentSort(col) {
  if (_paymentSort.col === col) { _paymentSort.dir = _paymentSort.dir === 'asc' ? 'desc' : 'asc'; }
  else { _paymentSort = { col: col, dir: 'asc' }; }
  $('payment-thead').innerHTML = '<tr>'
    + sortableTh('Date','paymentDate',_paymentSort,'togglePaymentSort','')
    + sortableTh('Client','clientName',_paymentSort,'togglePaymentSort','')
    + sortableTh('Invoice','invoiceNumber',_paymentSort,'togglePaymentSort','hide-mobile')
    + sortableTh('Method','method',_paymentSort,'togglePaymentSort','hide-mobile')
    + sortableTh('Amount','amount',_paymentSort,'togglePaymentSort','')
    + '<th class="hide-mobile">Status</th>'
    + '<th class="hide-mobile">Receipt</th>'
    + '</tr>';
  filterPaymentList();
}

function onEditPaymentReceiptSelected() {
  var input = $('ep-receipt-file');
  if (!input || !input.files || !input.files[0]) return;
  var file = input.files[0];
  if (file.size > 10 * 1024 * 1024) {
    $('ep-receipt-status').innerHTML = '<div class="status-banner error">File too large. Max 10MB.</div>';
    return;
  }
  $('ep-receipt-filename').textContent = file.name;
  window._pendingEpReceiptFile = file;
  $('ep-receipt-status').innerHTML = '<div class="status-banner" style="background:#f0ede5;border:1px solid #d9d2c7">Uploading\u2026</div>';
  var reader = new FileReader();
  reader.onload = function(evt) {
    var base64 = evt.target.result.split(',')[1];
    google.script.run
      .withSuccessHandler(function(result) {
        if (result.success) {
          _epReceiptFileId  = result.fileId;
          _epReceiptFileUrl = result.fileUrl;
          _epReceiptPickerSource = false;
          $('ep-receipt-filename').textContent = file.name + ' \u2713';
          $('ep-receipt-status').innerHTML = '<div class="status-banner success">Receipt uploaded \u2014 will be saved on submit.</div>';
        } else {
          $('ep-receipt-status').innerHTML = '<div class="status-banner error">Upload failed: ' + esc(result.error || 'Unknown error') + '</div>';
        }
      })
      .withFailureHandler(function(err) {
        $('ep-receipt-status').innerHTML = '<div class="status-banner error">Upload failed: ' + esc(err.message) + '</div>';
      })
      .panelUploadAndExtractReceipt({ base64: base64, fileName: file.name, mimeType: file.type });
  };
  reader.readAsDataURL(file);
}

function openEditPaymentDrivePicker() {
  $('ep-receipt-status').innerHTML = '<div class="status-banner" style="background:#f0ede5;border:1px solid #d9d2c7">Loading picker\u2026</div>';
  google.script.run
    .withSuccessHandler(function(config) {
      if (!config.apiKey || !config.appId) {
        $('ep-receipt-status').innerHTML = '<div class="status-banner error">Picker not configured.</div>';
        return;
      }
      _pickerConfig = config;
      var show = function() {
        $('ep-receipt-status').innerHTML = '';
        var docsView = new google.picker.DocsView()
          .setIncludeFolders(true)
          .setMimeTypes('image/jpeg,image/png,image/webp,image/gif,application/pdf');
        var picker = new google.picker.PickerBuilder()
          .addView(docsView)
          .setOAuthToken(_pickerConfig.token)
          .setDeveloperKey(_pickerConfig.apiKey)
          .setAppId(_pickerConfig.appId)
          .setCallback(function(data) {
            if (data.action !== google.picker.Action.PICKED) return;
            var doc = data.docs[0];
            $('ep-receipt-status').innerHTML = '<div class="status-banner" style="background:#f0ede5;border:1px solid #d9d2c7">Processing ' + esc(doc.name) + '\u2026</div>';
            google.script.run
              .withSuccessHandler(function(result) {
                if (result.success) {
                  _epReceiptFileId  = result.fileId;
                  _epReceiptFileUrl = result.fileUrl;
                  _epReceiptPickerSource = true;
                  $('ep-receipt-filename').textContent = doc.name + ' \u2713';
                  $('ep-receipt-status').innerHTML = '<div class="status-banner success">File selected \u2014 will be linked on submit.</div>';
                } else {
                  $('ep-receipt-status').innerHTML = '<div class="status-banner error">' + esc(result.error) + '</div>';
                }
              })
              .withFailureHandler(function(err) {
                $('ep-receipt-status').innerHTML = '<div class="status-banner error">' + esc(err.message) + '</div>';
              })
              .panelStagePickedFile(doc.id, doc.name);
          })
          .setOrigin('https://script.google.com')
          .setTitle('Select payment receipt')
          .setSelectableMimeTypes('image/jpeg,image/png,image/webp,image/gif,application/pdf')
          .build();
        picker.setVisible(true);
      };
      if (_pickerApiLoaded) { show(); }
      else { gapi.load('picker', function() { _pickerApiLoaded = true; show(); }); }
    })
    .withFailureHandler(function(e) {
      $('ep-receipt-status').innerHTML = '<div class="status-banner error">' + esc(e.message) + '</div>';
    })
    .panelGetPickerConfig();
}

function _loadEditPaymentDropdowns(selectedClientId, selectedInvoiceId) {
  cachedGetClients(function(clients) {
    if (!clients || clients.error) return;
    var sel = $('ep-client');
    clients.filter(function(c) { return c.status === 'Active' || c.id === selectedClientId; }).forEach(function(c) {
      var opt = document.createElement('option');
      opt.value = c.id; opt.textContent = c.name;
      if (c.id === selectedClientId) opt.selected = true;
      sel.appendChild(opt);
    });
  });
  google.script.run
    .withSuccessHandler(function(invoices) {
      if (!invoices || invoices.error) return;
      var sel = $('ep-invoice');
      // Show open invoices + always include the currently linked invoice even if Paid/Void
      var visible = invoices.filter(function(inv) {
        return inv.status !== 'Paid' && inv.status !== 'Void' || inv.id === selectedInvoiceId;
      });
      visible.forEach(function(inv) {
        var opt = document.createElement('option');
        var statusTag = (inv.status === 'Paid' || inv.status === 'Void') ? ' [' + inv.status + ']' : (inv.status && inv.status !== 'Sent' ? ' [' + inv.status + ']' : '');
        opt.value = inv.id; opt.textContent = inv.invoiceId + ' — ' + formatMoney(inv.total) + statusTag + (inv.clientName ? ' (' + inv.clientName + ')' : '');
        if (inv.id === selectedInvoiceId) opt.selected = true;
        sel.appendChild(opt);
      });
    }).panelGetAllInvoices();
}

function submitEditPayment(paymentPageId) {
  var amount = parseFloat($('ep-amount').value);
  if (!amount || amount <= 0) { $('ep-status').innerHTML = '<div class="status-banner error">Amount must be > 0.</div>'; return; }

  $('ep-submit').disabled = true; $('ep-submit').textContent = 'Saving\u2026';
  google.script.run
    .withSuccessHandler(function(result) {
      if (result.success) {
        _ssClear(); _invalidate('payments', 'invoices');
        $('ep-status').innerHTML = '<div class="status-banner success">Payment updated.</div>';
        $('ep-submit').textContent = 'Saved';
        setTimeout(function() { goBack(); }, 600);
      } else {
        $('ep-status').innerHTML = '<div class="status-banner error">' + esc(result.error) + '</div>';
        $('ep-submit').disabled = false; $('ep-submit').textContent = 'Save Changes';
      }
    })
    .withFailureHandler(function(e) {
      $('ep-status').innerHTML = '<div class="status-banner error">' + esc(e.message) + '</div>';
      $('ep-submit').disabled = false; $('ep-submit').textContent = 'Save Changes';
    })
    .panelUpdatePayment(paymentPageId, {
      description:    $('ep-description').value.trim(),
      amount:         amount,
      amountWithheld: parseFloat($('ep-withheld').value) || 0,
      paymentDate:    $('ep-date').value,
      method:         $('ep-method').value,
      clientId:       $('ep-client').value || '',
      invoiceId:      $('ep-invoice').value || '',
      receiptUrl:     _epReceiptFileUrl || ($('ep-receipt-url') ? $('ep-receipt-url').value : ''),
      receiptFileId:  _epReceiptFileId || '',
      pickerSource:   _epReceiptPickerSource,
      notes:          $('ep-notes').value.trim(),
    });
}

function _loadPaymentDropdowns(data) {
  cachedGetClients(function(clients) {
    if (!clients || clients.error) return;
    window._paymentClients = clients;
    var sel = $('pay-client');
    clients.filter(function(c) { return c.status === 'Active'; }).forEach(function(c) {
      var opt = document.createElement('option');
      opt.value = c.id; opt.textContent = c.name;
      sel.appendChild(opt);
    });
    if (data && data.clientId) {
      sel.value = data.clientId;
      onPaymentClientChange();
    }
  });

  google.script.run
    .withSuccessHandler(function(invoices) {
      if (!invoices || invoices.error) return;
      window._allInvoices = invoices;
      var sel = $('pay-invoice');
      var open = invoices.filter(function(inv) {
        return inv.status !== 'Paid' && inv.status !== 'Void';
      });
      open.forEach(function(inv) {
        var opt = document.createElement('option');
        var statusTag = inv.status && inv.status !== 'Sent' ? ' [' + inv.status + ']' : '';
        opt.value = inv.id; opt.textContent = inv.invoiceId + ' — ' + formatMoney(inv.total) + statusTag + (inv.clientName ? ' (' + inv.clientName + ')' : '');
        sel.appendChild(opt);
      });
      if (data && data.invoiceId) { sel.value = data.invoiceId; }
    })
    .panelGetAllInvoices();
}

// ── Withholding helpers ────────────────────────────────────

/** Toggle the withholding rate input on/off when the checkbox changes. */
function onWithholdingToggle(prefix) {
  var checked = $(prefix + '-withholding').checked;
  var wrap = $(prefix + '-withholding-rate-wrap');
  if (wrap) wrap.style.display = checked ? 'flex' : 'none';
}

/** Called when the client changes on the standalone Log Payment form. */
function onPaymentClientChange() {
  var clientId = $('pay-client') ? $('pay-client').value : '';
  var clients = window._paymentClients || [];
  var client = null;
  for (var i = 0; i < clients.length; i++) {
    if (clients[i].id === clientId) { client = clients[i]; break; }
  }
  var isWithholding = !!(client && client.withholdingAgent);
  var rate = (client && client.withholdingRate) ? client.withholdingRate : 10;

  var banner = $('pay-withholding-banner');
  var group  = $('pay-withheld-group');

  if (isWithholding) {
    if (group)  group.style.display  = '';
    if (banner) {
      banner.style.display = '';
      banner.style.cssText += ';background:#fef3c7;border-color:#d97706;color:#92400e';
      _updateWithholdingBanner(rate);
    }
    // Withholding clients typically pay in net only — don't auto-mark as Paid
    if ($('pay-markpaid')) $('pay-markpaid').checked = false;
  } else {
    if (group)  group.style.display  = 'none';
    if (banner) banner.style.display = 'none';
    if ($('pay-withheld')) $('pay-withheld').value = '';
    // Non-withholding clients — pre-check Mark as Paid
    if ($('pay-markpaid')) $('pay-markpaid').checked = true;
  }
}

/** Show/hide the Close Project checkbox based on whether the selected invoice has a project. */
function onPaymentInvoiceChange() {
  var invoiceId = $('pay-invoice') ? $('pay-invoice').value : '';
  var invoices = window._allInvoices || [];
  var inv = null;
  for (var i = 0; i < invoices.length; i++) {
    if (invoices[i].id === invoiceId) { inv = invoices[i]; break; }
  }
  var group = $('pay-close-project-group');
  if (group) {
    group.style.display = (inv && inv.projectId) ? '' : 'none';
    if ($('pay-close-project')) $('pay-close-project').checked = false;
  }
}

/** Recalculate withheld suggestion when amount changes. */
function onPaymentAmountChange() {
  var clientId = $('pay-client') ? $('pay-client').value : '';
  var clients = window._paymentClients || [];
  var client = null;
  for (var i = 0; i < clients.length; i++) {
    if (clients[i].id === clientId) { client = clients[i]; break; }
  }
  if (!client || !client.withholdingAgent) return;
  var rate = (client && client.withholdingRate) ? client.withholdingRate : 10;
  _updateWithholdingBanner(rate);
}

function _updateWithholdingBanner(rate) {
  var net      = parseFloat($('pay-amount') ? $('pay-amount').value : '0') || 0;  // check amount
  var rateD    = rate / 100;
  var withheld = parseFloat((net * rateD / (1 - rateD)).toFixed(2));
  var credit   = parseFloat((net + withheld).toFixed(2));
  var banner = $('pay-withholding-banner');
  if (banner) {
    banner.textContent = 'Withholding client (' + rate + '%) — withheld by client: '
      + formatMoney(withheld) + ', invoice credit: ' + formatMoney(credit);
  }
  if ($('pay-withheld') && net > 0) $('pay-withheld').value = withheld.toFixed(2);
}

/**
 * Called when the user edits the Payment Amount on the inline Log Payment form
 * (on invoice detail). Recalculates the withheld field and banner live.
 */
function onInlinePaymentAmountChange() {
  var cache = _invoiceViewCache;
  if (!cache || !cache.withholdingAgent) return;
  var rate     = cache.withholdingRate || 0.10; // stored as decimal, e.g. 0.10
  var net      = parseFloat($('lp-amount') ? $('lp-amount').value : '0') || 0;  // check amount
  var withheld = parseFloat((net * rate / (1 - rate)).toFixed(2));
  var credit   = parseFloat((net + withheld).toFixed(2));
  if ($('lp-withheld')) $('lp-withheld').value = withheld.toFixed(2);
  if ($('lp-banner'))   $('lp-banner').textContent = 'Withholding client (' + Math.round(rate * 100) + '%) — withheld by client: ' + formatMoney(withheld) + ', invoice credit: ' + formatMoney(credit);
}

// ── Payment Receipt Upload / Extract ───────────────────────
var _paymentReceiptLocalFile = null;

function onPaymentReceiptFileSelected() {
  var input = $('pay-receipt-file');
  if (!input.files || !input.files[0]) return;

  var file = input.files[0];
  if (file.size > 10 * 1024 * 1024) {
    $('pay-receipt-status').innerHTML = '<div class="status-banner error">File too large. Max 10MB.</div>';
    return;
  }

  _paymentReceiptLocalFile = file;
  $('pay-receipt-file-name').textContent = file.name + ' (' + (file.size / 1024).toFixed(0) + ' KB)';
  $('pay-receipt-extract-btn').style.display = '';
  $('pay-receipt-status').innerHTML = '';
}

function uploadAndExtractPaymentReceipt() {
  if (!_paymentReceiptLocalFile) return;

  $('pay-receipt-extract-btn').style.display = 'none';
  $('pay-receipt-status').innerHTML = '<div class="status-banner" style="background:#f0ede5;border:1px solid #d9d2c7">Uploading & extracting data\u2026 <span class="loading-dots"></span></div>';

  var reader = new FileReader();
  reader.onload = function(e) {
    var base64 = e.target.result.split(',')[1];
    google.script.run
      .withSuccessHandler(function(result) {
        if (result.success) {
          _paymentReceiptFileId = result.fileId;
          _paymentReceiptFileUrl = result.fileUrl;
          _paymentReceiptPickerSource = !!result.pickerSource;

          // Show receipt preview
          $('pay-receipt-preview').style.display = '';
          $('pay-receipt-preview-content').innerHTML = '<a href="' + esc(result.fileUrl) + '" target="_blank">' + esc(result.fileName) + '</a>';

          if (result.extracted) {
            _applyPaymentExtraction(result.extracted);
            $('pay-receipt-status').innerHTML = '<div class="status-banner success">Data extracted. Review and submit.</div>';
          } else {
            $('pay-receipt-status').innerHTML = '<div class="status-banner" style="background:#fef3cd;border:1px solid #f0d980">File uploaded but extraction failed: ' + esc(result.extractionError || 'Unknown') + '. Fill fields manually.</div>';
          }
        } else {
          $('pay-receipt-status').innerHTML = '<div class="status-banner error">Upload failed: ' + esc(result.error) + '</div>';
          $('pay-receipt-extract-btn').style.display = '';
        }
      })
      .withFailureHandler(function(err) {
        $('pay-receipt-status').innerHTML = '<div class="status-banner error">' + esc(err.message) + '</div>';
        $('pay-receipt-extract-btn').style.display = '';
      })
      .panelUploadAndExtractPaymentReceipt({
        base64: base64,
        fileName: _paymentReceiptLocalFile.name,
        mimeType: _paymentReceiptLocalFile.type,
        clientId: $('pay-client').value || null,
      });
  };
  reader.readAsDataURL(_paymentReceiptLocalFile);
}

function openPaymentDrivePicker() {
  $('pay-receipt-status').innerHTML = '<div class="status-banner" style="background:#f0ede5;border:1px solid #d9d2c7">Loading picker\u2026</div>';

  google.script.run
    .withSuccessHandler(function(config) {
      if (!config.apiKey || !config.appId) {
        $('pay-receipt-status').innerHTML = '<div class="status-banner error">Picker not configured. Set PICKER_API_KEY and PICKER_APP_ID in Script Properties.</div>';
        return;
      }
      _pickerConfig = config;
      var show = function() {
        $('pay-receipt-status').innerHTML = '';
        var docsView = new google.picker.DocsView()
          .setIncludeFolders(true)
          .setMimeTypes('image/jpeg,image/png,image/webp,image/gif,application/pdf');

        var picker = new google.picker.PickerBuilder()
          .addView(docsView)
          .setOAuthToken(_pickerConfig.token)
          .setDeveloperKey(_pickerConfig.apiKey)
          .setAppId(_pickerConfig.appId)
          .setCallback(function(pickerData) { _onPaymentPickerCallback(pickerData); })
          .setOrigin('https://script.google.com')
          .setTitle('Select payment receipt')
          .setSelectableMimeTypes('image/jpeg,image/png,image/webp,image/gif,application/pdf')
          .build();
        picker.setVisible(true);
      };

      if (_pickerApiLoaded) { show(); }
      else { gapi.load('picker', function() { _pickerApiLoaded = true; show(); }); }
    })
    .withFailureHandler(function(e) {
      $('pay-receipt-status').innerHTML = '<div class="status-banner error">' + esc(e.message) + '</div>';
    })
    .panelGetPickerConfig();
}

function _onPaymentPickerCallback(data) {
  if (data.action !== google.picker.Action.PICKED) return;
  var doc = data.docs[0];
  var fileId = doc.id;
  var fileName = doc.name;

  $('pay-receipt-status').innerHTML = '<div class="status-banner" style="background:#f0ede5;border:1px solid #d9d2c7">Processing ' + esc(fileName) + '\u2026 <span class="loading-dots"></span></div>';
  $('pay-receipt-extract-btn').style.display = 'none';

  google.script.run
    .withSuccessHandler(function(result) {
      if (result.success) {
        _paymentReceiptFileId = result.fileId;
        _paymentReceiptFileUrl = result.fileUrl;
        _paymentReceiptPickerSource = !!result.pickerSource;

        $('pay-receipt-preview').style.display = '';
        $('pay-receipt-preview-content').innerHTML = '<a href="' + esc(result.fileUrl) + '" target="_blank">' + esc(result.fileName) + '</a>';

        if (result.extracted) {
          _applyPaymentExtraction(result.extracted);
          $('pay-receipt-status').innerHTML = '<div class="status-banner success">Data extracted from Drive file. Review and submit.</div>';
        } else {
          $('pay-receipt-status').innerHTML = '<div class="status-banner" style="background:#fef3cd;border:1px solid #f0d980">Extraction failed: ' + esc(result.extractionError || 'Unknown') + '. Fill fields manually.</div>';
        }
      } else {
        $('pay-receipt-status').innerHTML = '<div class="status-banner error">' + esc(result.error) + '</div>';
        $('pay-receipt-extract-btn').style.display = '';
      }
    })
    .withFailureHandler(function(err) {
      $('pay-receipt-status').innerHTML = '<div class="status-banner error">' + esc(err.message) + '</div>';
      $('pay-receipt-extract-btn').style.display = '';
    })
    .panelPickerExtractPaymentReceipt({
      fileId: fileId,
      fileName: fileName,
      clientId: $('pay-client').value || null,
    });
}

/** Apply AI-extracted data to the payment form fields. */
function _applyPaymentExtraction(data) {
  if (data.amount && $('pay-amount'))      $('pay-amount').value = data.amount;
  if (data.date && $('pay-date'))          $('pay-date').value = data.date;
  if (data.vendor && $('pay-description')) {
    var desc = data.vendor;
    if (data.description) desc += ' — ' + data.description;
    $('pay-description').value = desc;
  } else if (data.description && $('pay-description')) {
    $('pay-description').value = data.description;
  }
  if (data.notes && $('pay-notes')) $('pay-notes').value = data.notes;

  // Auto-select payment method if extracted
  if (data.method && $('pay-method')) {
    var methodSel = $('pay-method');
    for (var i = 0; i < methodSel.options.length; i++) {
      if (methodSel.options[i].value.toLowerCase() === data.method.toLowerCase()) {
        methodSel.value = methodSel.options[i].value;
        break;
      }
    }
  }

  // Auto-match invoice if AI extracted an invoice number
  if (data.invoiceNumber && window._allInvoices && $('pay-invoice')) {
    var invNum = data.invoiceNumber.trim().toUpperCase();
    var matched = false;
    for (var j = 0; j < window._allInvoices.length; j++) {
      var inv = window._allInvoices[j];
      if (inv.invoiceId && inv.invoiceId.toUpperCase() === invNum) {
        $('pay-invoice').value = inv.id;
        matched = true;
        break;
      }
    }
    if (!matched && data.invoiceNumber) {
      // Put unmatched invoice number in notes so it's not lost
      var notes = $('pay-notes').value;
      $('pay-notes').value = (notes ? notes + ' | ' : '') + 'Invoice ref: ' + data.invoiceNumber;
    }

function submitNewPayment() {

  if (!net || net <= 0) { $('pay-status').innerHTML = '<div class="status-banner error">Amount must be greater than zero.</div>'; return; }
  if (!$('pay-date').value) { $('pay-status').innerHTML = '<div class="status-banner error">Date is required.</div>'; return; }
  var withheld  = parseFloat(($('pay-withheld') ? $('pay-withheld').value : '') || '0') || 0;
  var netAmount = net;  // stored amount IS the check amount

  $('pay-submit').disabled = true; $('pay-submit').textContent = 'Logging\u2026';

  google.script.run
    .withSuccessHandler(function(result) {
      if (result.success) {
        _ssClear(); _invalidate('payments', 'invoices');
        var msg = 'Payment logged: ' + esc(result.payment.paymentId);
        if (result.invoiceUpdated) msg += '. Invoice marked as Paid.';
        if (result.projectClosed)  msg += ' Project closed.';
        if (result.projectCloseError) msg += ' (Could not close project: ' + esc(result.projectCloseError) + ')';

        $('pay-submit').textContent = 'Logged';
